<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu app — TORQUE FIT</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../assets/icons/icon.svg" type="image/svg+xml">
<style>
  body { font-family: system-ui, sans-serif; background: #121016; color: #f5f4f7; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; text-align: center; }
  .box { padding: 30px; }
  .marca { font-size: 11px; letter-spacing: .3em; font-weight: 800; color: #a78bfa; text-transform: uppercase; }
  .box p { margin-top: 14px; color: #cfcbdb; }
</style>
</head>
<body>
<div class="box"><div class="marca">TORQUE</div><p id="msg">Abrindo seu app…</p></div>
<script src="../assets/cloud-config.js"></script>
<script src="../assets/versao.js"></script>
<!-- o código do app vem daqui, do site: uma fonte só pra todos os alunos -->
<script src="aluno-skin.js"></script>
<script src="aluno-builder.js"></script>
<!-- e o do paciente do NUTRI também (o pacote diz qual é pelo dados.tipo) -->
<script src="nutri-skin.js"></script>
<script src="nutri-builder.js"></script>
<script>
(function () {
  // token: da URL ou, se instalado/aberto sem ?t=, o último usado neste aparelho
  var t = new URLSearchParams(location.search).get("t") || "";
  try { t = t || localStorage.getItem("tq_app_token") || ""; } catch (e) {}
  var cfg = self.MT_CLOUD || {};
  function abre(html) { document.open(); document.write(html); document.close(); }
  function recado(txt) { document.getElementById("msg").textContent = txt; }
  function guardado(chave) { try { return localStorage.getItem(chave) || ""; } catch (e) { return ""; } }

  /* Junta os dados do aluno com o código do site. Se o construtor não carregou
   * (site fora do ar, cache velho), cai no HTML pronto que veio junto — é por
   * isso que o pacote ainda traz os dois. */
  function montaDoPacote(pac) {
    if (!pac || typeof pac !== "object") return "";
    // o D diz de quem é o app: dados.tipo === "nutri" vai pro builder do paciente
    // (nutri-builder.js); sem tipo é o app do aluno de sempre. NUNCA entregar um
    // pacote de nutri pro MT_APP_ALUNO — os campos não batem e o app sairia vazio.
    var d = pac.dados || (pac.a || pac.tipo ? pac : null);
    if (d && d.tipo === "nutri") {
      if (self.MT_APP_NUTRI) { try { return self.MT_APP_NUTRI.monta(d); } catch (e) {} }
      return pac.html || "";
    }
    if (self.MT_APP_ALUNO) {
      // formato normal: o registro é {html, dados, ver, stamp}
      if (pac.dados) { try { return self.MT_APP_ALUNO.monta(pac.dados); } catch (e) {} }
      // e o registro que já veio SEM embrulho (pacote antigo, ou envelope que
      // entrega o D direto) também tem que montar
      if (pac.a) { try { return self.MT_APP_ALUNO.monta(pac); } catch (e) {} }
    }
    return pac.html || "";
  }
  // cópia local: abre offline e volta a funcionar sem internet
  function copiaLocal() {
    var crus = guardado("tq_app_pacote");
    if (crus) { try { return montaDoPacote(JSON.parse(crus)); } catch (e) {} }
    return guardado("tq_app_html"); // formato antigo (só HTML)
  }
  function guarda(pac) {
    try {
      // guarda os DADOS, não o HTML: o código sempre vem do site na próxima vez
      localStorage.setItem("tq_app_pacote", JSON.stringify({ dados: pac.dados || null, html: pac.dados ? "" : (pac.html || "") }));
      localStorage.setItem("tq_app_stamp", pac.stamp || "");
      if (pac.dados) localStorage.removeItem("tq_app_html");
    } catch (e) {}
  }

  /* A regra que faltava: SÓ apaga quando o servidor DISSE que acabou.
   * Falha de rede nunca apaga nada — a cópia local existe justamente pro aluno
   * que treina no subsolo, sem sinal. */
  function apagaTudoDoAparelho() {
    try {
      ["tq_app_pacote", "tq_app_html", "tq_app_stamp", "tq_app_visto", "tq_app_token", "mt_aluno_token"]
        .forEach(function (k) { localStorage.removeItem(k); });
      // e os registros do treino que ficaram guardados aqui
      var fora = [];
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && /^(pt|nt)[a-z]/.test(k)) fora.push(k);
      }
      fora.forEach(function (k) { localStorage.removeItem(k); });
    } catch (e) {}
    try {
      if (self.caches && caches.keys) {
        caches.keys().then(function (ks) {
          ks.forEach(function (k) { if (k.indexOf("mt-app-") === 0) caches.delete(k); });
        });
      }
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
        navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); });
      }
    } catch (e) {}
  }
  function acessoAcabou(motivo) {
    apagaTudoDoAparelho();
    document.querySelector(".box").innerHTML =
      '<div class="marca">TORQUE</div><p>' +
      (motivo === "revogado"
        ? "Seu acesso foi encerrado por quem cuida do seu treino."
        : "Este app não existe mais.") +
      '</p><p style="font-size:13px;">Se achar que foi engano, fale com a sua academia ou com o seu personal.</p>' +
      '<p style="font-size:13px;"><a href="../aluno-login.html?sair=1">Entrar com outro login</a></p>';
  }

  if (!t || !cfg.url) {
    var cop0 = copiaLocal();
    if (cop0) { abre(cop0); return; }
    // quem chega aqui geralmente salvou o atalho ANTIGO na tela inicial (sem o
    // token). O caminho de volta existe: entrar com o e-mail refaz o link.
    document.querySelector(".box").innerHTML =
      '<div class="marca">TORQUE</div>' +
      "<p>Este atalho ficou desatualizado.</p>" +
      '<p style="font-size:13px;">Entre com o seu e-mail que a gente te leva pro seu app — depois é só salvar na tela de início de novo.</p>' +
      '<p><a href="../aluno-login.html" style="display:inline-block;background:#7c3aed;color:#fff;border-radius:99px;padding:13px 26px;font-weight:800;font-size:15px;text-decoration:none;">Entrar com meu e-mail</a></p>' +
      '<p style="font-size:12.5px;color:#8a8695;">Ou peça o seu link do app pro seu personal.</p>';
    return;
  }
  try { localStorage.setItem("tq_app_token", t); } catch (e) {}
  /* Manifest com o token (v696): o start_url "./" fazia o app salvo na tela
   * inicial abrir SEM o ?t= — e no iPhone o app instalado tem um cofre de
   * dados separado do Safari, então a reserva do localStorage nem existia lá.
   * Com o token na mão, o manifest vira um data: com o link completo (ícones
   * absolutos: dentro de um data:, endereço relativo não resolve). */
  try {
    var manL = { name: "TORQUE FIT — Meu app", short_name: "TORQUE FIT", display: "standalone",
      background_color: "#121016", theme_color: "#7c3aed",
      start_url: location.origin + "/app/?t=" + encodeURIComponent(t),
      scope: location.origin + "/app/",
      icons: [
        { src: location.origin + "/assets/icons/icon-192.png", sizes: "192x192", type: "image/png" },
        { src: location.origin + "/assets/icons/icon-512.png", sizes: "512x512", type: "image/png" },
        { src: location.origin + "/assets/icons/icon-maskable-512.png", sizes: "512x512", type: "image/png", purpose: "maskable" },
      ] };
    var lnM = document.querySelector("link[rel='manifest']");
    if (lnM) lnM.href = "data:application/manifest+json;charset=utf-8," + encodeURIComponent(JSON.stringify(manL));
  } catch (e) {}

  function cabecalhos() {
    return { apikey: cfg.anonKey, Authorization: "Bearer " + cfg.anonKey, "Content-Type": "application/json" };
  }
  /* Dizer a VERDADE quando não abre.
   *
   * Antes qualquer tropeço virava "Sem internet agora" — inclusive com o celular
   * no 5G. Aí o aluno reclamava do celular, o professor reclamava do aluno, e
   * ninguém olhava pro lugar certo. Agora cada motivo tem o seu recado, e os
   * detalhes técnicos ficam a um toque de distância. */
  var pista = "";
  function anota(txt) { pista = String(txt || "").slice(0, 300); }
  function semResposta(motivo) {
    var cop = copiaLocal();
    if (cop) { abre(cop); return; }   // tem cópia no aparelho: abre e pronto
    var offline = !navigator.onLine;
    var msg, dica;
    if (motivo === "rede" || offline) {
      msg = "Sem internet agora — tenta de novo em instantes.";
      dica = "O app funciona sem internet depois que você abrir ele uma vez.";
    } else if (motivo === "vazio") {
      msg = "Este link ainda não tem app publicado.";
      dica = "Peça pro seu personal abrir o sistema e tocar em <b>Publicar app</b> no seu perfil.";
    } else {
      msg = "O sistema da sua academia não respondeu.";
      dica = "Não é o seu celular. Mostra esta tela pro seu personal — ele resolve pelo painel.";
    }
    document.querySelector(".box").innerHTML =
      '<div class="marca">TORQUE</div><p>' + msg + "</p>" +
      '<p style="font-size:13px;">' + dica + "</p>" +
      '<p><button id="tentar" style="background:#7c3aed;color:#fff;border:0;border-radius:99px;padding:13px 26px;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;">Tentar de novo</button></p>' +
      '<p><button id="verdet" style="background:none;border:0;color:#8a8695;font-family:inherit;font-size:12.5px;text-decoration:underline;cursor:pointer;">Ver detalhes</button></p>' +
      '<pre id="det" hidden style="text-align:left;font-size:11px;color:#8a8695;background:rgba(255,255,255,.04);padding:10px;border-radius:10px;white-space:pre-wrap;word-break:break-word;"></pre>';
    document.getElementById("tentar").onclick = function () { location.reload(); };
    document.getElementById("verdet").onclick = function () {
      var d = document.getElementById("det");
      d.hidden = !d.hidden;
      d.textContent = "motivo: " + (motivo || "?") + "\nonline: " + navigator.onLine +
        "\nnuvem: " + (cfg.url || "(não configurada)") + "\ntoken: " + (t ? t.slice(0, 6) + "…" : "(vazio)") +
        "\nversao: " + (self.MT_VERSAO || "?") + "\n" + pista;
    };
  }
  // caminho antigo: vale pra quem ainda não rodou o SQL novo
  function buscaAntiga() {
    return fetch(cfg.url + "/rest/v1/rpc/app_aluno_busca", {
      method: "POST", headers: cabecalhos(), body: JSON.stringify({ t: t }),
    }).then(function (r) {
      // o PGRST202 do app_aluno_estado é ESPERADO em quem ainda não rodou o SQL
      // novo — quem decide o recado é o que ESTA busca viu, não aquela
      if (!r.ok) { anota("app_aluno_busca HTTP " + r.status); return { erro: 1 }; }
      return r.json().catch(function () { anota("app_aluno_busca devolveu algo que não é JSON"); return { erro: 1 }; });
    }).then(function (d) {
      if (d && d.erro) { semResposta("servidor"); return; }
      var html = montaDoPacote(d);
      if (html) { guarda(d); abre(html); return; }
      if (d && d.code) { anota("app_aluno_busca: " + d.code + " " + (d.message || "")); semResposta("servidor"); return; }
      // JSON válido e vazio: o servidor está de pé, este token é que não tem app
      semResposta(d === null || d === undefined ? "vazio" : "servidor");
    }).catch(function (e) { anota("app_aluno_busca falhou: " + (e && e.message)); semResposta("rede"); });
  }

  fetch(cfg.url + "/rest/v1/rpc/app_aluno_estado", {
    method: "POST", headers: cabecalhos(), body: JSON.stringify({ t: t }),
  }).then(function (r) {
    if (!r.ok) anota("app_aluno_estado HTTP " + r.status);
    return r.json().catch(function () { return null; });
  }).then(function (d) {
    // envelope de verdade? então o servidor falou, e a palavra dele vale
    if (d && typeof d === "object" && typeof d.ok === "boolean") {
      if (!d.ok) { acessoAcabou(d.motivo); return; }
      /* d.dados JÁ É o pacote gravado pelo painel ({html, dados, ver, stamp}).
       * Embrulhar de novo fazia o app ser montado com o embrulho no lugar dos
       * dados do aluno — e como o embrulho novo não levava o html de reserva,
       * a tela morria em "não respondeu". Era o defeito que o Raphael viu. */
      var pac = d.dados;
      var html = montaDoPacote(pac);
      if (!html) { anota("o pacote veio sem dados que montem o app"); semResposta("servidor"); return; }
      guarda(pac && pac.dados ? pac : { dados: pac, stamp: (pac && pac.stamp) || "" });
      try { localStorage.setItem("tq_app_visto", new Date().toISOString()); } catch (e) {}
      abre(html);
      return;
    }
    if (d && d.code) anota("app_aluno_estado: " + d.code + " " + (d.message || ""));
    // função ainda não publicada (ou resposta estranha): cai no caminho antigo
    return buscaAntiga();
  }).catch(function (e) { anota("app_aluno_estado falhou: " + (e && e.message)); return buscaAntiga(); });
  // guarda o esqueleto (esta página + o construtor) pro app abrir sem internet
  try {
    if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("app-sw.js");
  } catch (e) {}
  window.__appLoader = true; // testes
})();
</script>
</body>
</html>
