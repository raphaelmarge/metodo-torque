          ><span class="ia05-voce-in" id="ia05-voce-in">voc&ecirc;</span></span
        >
        <span class="ia05-sw">escrever</span> <span class="ia05-sw">sobre</span>

    <script src="assets/gsap.min.js"></script>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });
        window.__timelines["05-ia"] = tl;

        var DUR = 5;

        /* ---- Scene 1 (0.0–1.8s): phone card arrives from the left ----
           spring-pop-entrance (calm settle): fromTo scale-grow on power3.out,
           no overshoot; combined with the slide-in from the left. */
        tl.fromTo(
          "#ia05-phone",
          { x: -520, scale: 0.78, opacity: 0 },
          { x: 0, scale: 1, opacity: 1, duration: 0.8, ease: "power3.out" },
          0.05
        );

        /* highlight sweep on the "Gerar com IA" button: ring pops, sheen
           band crosses it once, then the ring dims as the frame yields */
        tl.fromTo(
          "#ia05-hl",
          { opacity: 0, scale: 0.85 },
          { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" },
          0.85
        );
        tl.fromTo(
          "#ia05-sheen",
          { xPercent: 0 },
          { xPercent: 680, duration: 0.65, ease: "power2.inOut" },
          1.0
        );
        tl.to(
          "#ia05-hl",
          { opacity: 0.35, duration: 0.4, ease: "power2.out" },
          1.85
        );

        /* ---- Scene 2 (1.8–3.4s): signature weight-transfer ----
           the card slides ~15% left + scales down, HANDING its weight to the
           display line that enters the vacated column (overlapping windows,
           one event). */
        tl.to(
          "#ia05-phone",
          { x: -162, scale: 0.9, duration: 0.75, ease: "power3.inOut" },
          1.8
        );
        tl.fromTo(
          "#ia05-rule",
          { scaleX: 0 },
          { scaleX: 1, duration: 0.45, ease: "power3.out" },
          2.0
        );
        gsap.utils.toArray(".ia05-w").forEach(function (el, i) {
          tl.fromTo(
            el,
            { y: 70, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
            2.15 + i * 0.085
          );
        });

        /* ---- Scene 3 (3.4–5.0s): sub-line staggered per word ---- */
        gsap.utils.toArray(".ia05-sw").forEach(function (el, i) {
          tl.fromTo(
            el,
            { y: 30, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" },
            3.45 + i * 0.055
          );
        });

        /* keyword glow on "você" — asr-keyword-glow mechanics: one linear
           driver sweeps scene time; an attack/sustain/release envelope drives
           text-shadow blur + scale, decaying to a rest level (never to zero).
           Applied to an inner span so it never fights the entrance tween. */
        var voceIn = document.getElementById("ia05-voce-in");
        var V_START = 3.95;
        var V_END = 4.45;
        var ATTACK = 0.18;
        var RELEASE = 0.4;
        var REST = 0.3;
        var MAX_BLUR = 34;
        var MAX_SCALE = 0.12;
        function envAt(time) {
          if (time < V_START) return 0;
          if (time < V_END) return Math.min((time - V_START) / ATTACK, 1);
          var releaseEnd = V_END + RELEASE;
          if (time < releaseEnd)
            return 1 - ((time - V_END) / RELEASE) * (1 - REST);
          return REST;
        }
        var driver = { t: 0 };
        tl.to(
          driver,
          {
            t: DUR,
            duration: DUR,
            ease: "none",
            onUpdate: function () {
              var e = envAt(driver.t);
              voceIn.style.textShadow =
                "0 0 " +
                MAX_BLUR * e +
                "px rgba(124,58,237," +
                0.85 * e +
                "), 0 0 " +
                12 * e +
                "px rgba(124,58,237," +
                0.6 * e +
                ")";
              voceIn.style.transform = "scale(" + (1 + MAX_SCALE * e) + ")";
            },
          },
          0
        );
        /* settle + micro-hold: nothing new after ~4.5s — no exit (non-final frame) */
      })();
    </script>
