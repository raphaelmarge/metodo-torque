    <script src="assets/gsap.min.js"></script>
    <script>
      (function () {
        var tl = gsap.timeline({ paused: true });
        window.__timelines = window.__timelines || {};
        window.__timelines["03-assume"] = tl;

        /* ── Scene 1 (0.0–0.9s) — chips rest clustered, then one-stroke sweep out ──
           center-outward-expansion inverted as an exit: each chip flies along its
           own radial vector past the frame edge; accelerating "in" ease is correct
           for a fling-away (the rule's out-only law governs the entry form). */
        var chips = document.querySelectorAll(".f03assume-chip");
        chips.forEach(function (el, i) {
          var tx = Number(el.dataset.tx);
          var ty = Number(el.dataset.ty);
          var rot = Number(el.dataset.rot);
          tl.fromTo(
            el,
            { xPercent: -50, yPercent: -50, x: tx, y: ty, rotation: rot, opacity: 1 },
            {
              x: tx * 4.2,
              y: ty * 4.2,
              rotation: rot * 2.4,
              opacity: 0,
              duration: 0.5,
              ease: "power2.in",
            },
            0.28 + i * 0.02
          );
        });

        /* motion-blur-streak (light) — one wrapper-level envelope riding the SAME
           window + ease as the sweep, so peak blur lands on peak speed. Seeded at
           0: the static open must be razor sharp. */
        var blurNode = document.getElementById("f03assume-streak-blur");
        var blurProxy = { v: 0 };
        var writeBlur = function () {
          blurNode.setAttribute("stdDeviation", blurProxy.v + " " + blurProxy.v);
        };
        writeBlur();
        tl.to(
          blurProxy,
          { v: 13, duration: 0.5, ease: "power2.in", onUpdate: writeBlur },
          0.28
        );

        /* ── Scene 2 (0.9–2.4s) — lockup per-word, then the accent bar self-draw ── */
        tl.fromTo(
          document.getElementById("f03assume-w1"),
          { y: 90, opacity: 0, scale: 0.94 },
          { y: 0, opacity: 1, scale: 1, duration: 0.75, ease: "power3.out" },
          0.95
        );
        tl.fromTo(
          document.getElementById("f03assume-w2"),
          { y: 90, opacity: 0, scale: 0.94 },
          { y: 0, opacity: 1, scale: 1, duration: 0.75, ease: "power3.out" },
          1.15
        );

        /* svg-path-draw — measured length, never guessed */
        var bar = document.getElementById("f03assume-bar");
        var barLen = bar.getTotalLength();
        bar.style.strokeDasharray = String(barLen);
        bar.style.strokeDashoffset = String(barLen);
        tl.to(
          bar,
          { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" },
          1.75
        );

        /* ── Scene 3 (2.4–5.0s) — sub-line per-word; phone rises; glow blooms ── */
        var subWords = document.querySelectorAll(".f03assume-sw");
        subWords.forEach(function (el, i) {
          tl.fromTo(
            el,
            { y: 26, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" },
            2.45 + i * 0.09
          );
        });

        /* spring-pop-entrance (smooth-settle register, no overshoot): the phone
           rises from below the frame and settles tilted −6°. */
        tl.fromTo(
          document.getElementById("f03assume-phone"),
          { y: 940, rotation: 2 },
          { y: 0, rotation: -6, duration: 1.15, ease: "power3.out" },
          2.7
        );

        /* ambient-glow-bloom — blooms behind the phone, landing ON the phone's
           settle (2.85 + 1.0 ≈ 3.85) so glow and hero resolve as one beat. */
        tl.fromTo(
          document.getElementById("f03assume-glow"),
          { opacity: 0, scale: 0.85 },
          { opacity: 0.34, scale: 1, duration: 1.0, ease: "power2.out" },
          2.85
        );

        /* bounded breathe on an INNER layer during the hold — finite phase tween
           (never yoyo); writing on the child keeps the bloom tween the sole owner
           of the wrapper's opacity, so back-seeks stay correct. */
        var glowInner = document.getElementById("f03assume-glow-inner");
        var phase = { p: 0 };
        tl.to(
          phase,
          {
            p: Math.PI,
            duration: 1.15,
            ease: "none",
            onUpdate: function () {
              var s = Math.sin(phase.p);
              glowInner.style.opacity = String(1 - 0.1 * s);
              glowInner.style.transform = "scale(" + (1 + 0.02 * s) + ")";
            },
          },
          3.85
        );
        /* 3.85 → 5.0 holds — the allocated stillness of the titlecard-reveal. */
      })();
