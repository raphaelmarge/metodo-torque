name: Landing PERSONAL

on:
  pull_request:
    paths:
      - personal-vendas.html
      - assets/landing-personal.*
      - assets/vendas/**
      - tests/test-landing-v2.js
      - .github/workflows/landing.yml

permissions:
  contents: read

jobs:
  landing:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preparar navegador
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Conferir a landing em seis larguras
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /dev/null 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8765/personal-vendas.html > /dev/null; then break; fi
            sleep 0.25
          done
          node tests/test-landing-v2.js
