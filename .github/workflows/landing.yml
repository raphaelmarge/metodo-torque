name: Landing PERSONAL

on:
  pull_request:
    paths:
      - personal-vendas.html
      - personal.html
      - personal-assinatura.html
      - app-personal-trainer.html
      - torqueon.html
      - assets/landing-personal.*
      - assets/personal-sales.*
      - assets/personal-sales-intent.js
      - assets/personal-saas-checkout.*
      - assets/modulo-conta.js
      - assets/versao.js
      - sw.js
      - app/app-sw.js
      - assets/vendas/**
      - tests/test-landing-v2.js
      - tests/test-personal-sales-*.js
      - tests/test-personal-saas-*.js
      - tests/test-personal-signup-product.js
      - supabase/functions/_shared/personal-billing-handler.mjs
      - supabase/releases/personal-billing-optional/**
      - tests/test-versao.js
      - supabase/functions/_shared/personal-sales.mjs
      - supabase/functions/_shared/hq-referrals*
      - supabase/migrations/*hq_referrals*
      - apps/hq.html
      - assets/hq-referrals.*
      - tests/test-hq-referrals*.js
      - .github/workflows/landing.yml

permissions:
  contents: read

jobs:
  landing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preparar navegador
        run: |
          npm ci --prefix tests/ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix tests/runtime --ignore-scripts --no-audit --no-fund
          bash .github/scripts/prepara-playwright-ci.sh
          node tests/ci/node_modules/playwright/cli.js install --with-deps chromium
      - name: Conferir a landing em seis larguras
        run: |
          export NODE_PATH="$PWD/tests/ci/node_modules"
          python3 -m http.server 8765 --bind 127.0.0.1 > /dev/null 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8765/personal-vendas.html > /dev/null; then break; fi
            sleep 0.25
          done
          node tests/test-landing-v2.js
          node tests/test-personal-sales-core.js
          node tests/test-personal-sales-intent.js
          node tests/test-conta-recuperacao.js
          node tests/test-versao.js
          node tests/test-personal-sales-browser.js
          node tests/test-personal-sales-trial.js
          node tests/test-personal-sales-cache.js
          node tests/test-personal-saas-checkout-browser.js
          node tests/test-personal-signup-product.js
          node tests/test-hq-referrals-store.js
          node tests/test-hq-referrals-sql.js
          node tests/test-hq-referrals-browser.js
