name: Diagnostico compacto dos calendarios
on:
  push:
    branches: [feat/alimentacao-calendario-horarios]
    paths: [.github/workflows/calendar-ci-diagnostic-once.yml]
permissions:
  contents: read
  actions: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ler o log do job que falhou sem alterar codigo ou dados
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/raphaelmarge/metodo-torque/actions/jobs/103147635846/logs > "$RUNNER_TEMP/calendar-failed-job.log"
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'calendar-failed-job.log'
          lines=p.read_text(errors='replace').splitlines()
          matches=[i for i,s in enumerate(lines) if re.search(r'FALH|FAIL|AssertionError|TimeoutError|\bError:|✗|✖|❌',s,re.I)]
          chosen=set(range(max(0,len(lines)-30),len(lines)))
          for i in matches[-18:]:
              chosen.update(range(max(0,i-3),min(len(lines),i+9)))
          output='\n'.join(str(i+1)+': '+lines[i] for i in sorted(chosen))
          result=Path(os.environ['RUNNER_TEMP'])/'calendar-ci-errors.txt'
          result.write_text(output)
          print(output[-26000:])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: calendar-ci-errors
          path: ${{ runner.temp }}/calendar-ci-errors.txt
          retention-days: 1
          if-no-files-found: error
