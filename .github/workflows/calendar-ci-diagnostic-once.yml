name: Diagnostico compacto dos calendarios
on:
  push:
    branches: [feat/alimentacao-calendario-horarios]
    paths: [.github/workflows/calendar-ci-diagnostic-once.yml]
permissions:
  contents: read
  actions: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ler o log do job que falhou sem alterar codigo ou dados
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/calendar-ci-diagnostic"
          gh api --allow-escape-sequences repos/raphaelmarge/metodo-torque/actions/jobs/103147635846/logs > "$RUNNER_TEMP/calendar-ci-diagnostic/failed-job.log"
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'calendar-ci-diagnostic'
          lines=re.sub(r'\x1b\[[0-9;]*[A-Za-z]','',(root/'failed-job.log').read_text(errors='replace')).splitlines()
          matches=[i for i,s in enumerate(lines) if re.search(r'❌|✗|✖|💥|AssertionError|TimeoutError|\bError:|[1-9][0-9]* falhas',s)]
          chosen=set()
          for i in matches:
              chosen.update(range(max(0,i-5),min(len(lines),i+12)))
          output='\n'.join(str(i+1)+': '+lines[i] for i in sorted(chosen))
          (root/'errors.txt').write_text(output)
          print(output[-26000:])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: calendar-ci-diagnostic
          path: ${{ runner.temp }}/calendar-ci-diagnostic
          retention-days: 1
          if-no-files-found: error
