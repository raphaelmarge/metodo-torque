name: Validar ajustes móveis v832
on:
  push:
    branches: [codex/validar-sync-mobile-v832]
permissions:
  contents: write
jobs:
  validar:
    if: github.ref == 'refs/heads/codex/validar-sync-mobile-v832'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Aplicar correções delimitadas do CI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          expected = {
            'apps/store.js': 'a07b33b1db4390f18d5a7d84c458acab92b0de8ed215277cae32860b5ee1efcb',
            'tests/test-sync-recuperacao-mobile.js': 'e4f9fc67d8a76be347cdf8e3997d4ae82415d1dc3b5228094d0a480fd73a5015',
            'tests/test-sync-recuperacao-browser.js': '0eb2573ed1caa161d1effa0639f3408b3af6e70405c0389f56558e38b6331e75',
          }
          for name, digest in expected.items():
            assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest, 'Base divergiu: ' + name
          def replace(name, old, new):
            p=Path(name); text=p.read_text(); assert text.count(old)==1, (name, old[:80]); p.write_text(text.replace(old,new))
          replace('apps/store.js', '        leitura(key, value, gravadoRaw); return true;', '        leitura(key, value, gravadoRaw);\n        // O contrato do Personal exige uma notificação para concluir o Salvar,\n        // mesmo sem mudança. Não cria timestamp, auditoria nem envio artificial.\n        ouvintes.forEach(function (cb) { try { cb(key); } catch (e) {} });\n        return true;')
          replace('tests/test-sync-recuperacao-mobile.js', "'salvar sem mudança preserva carimbo, revisão e fila limpa'", "'salvar sem mudança notifica uma vez e preserva carimbo, revisão e fila limpa'")
          replace('tests/test-sync-recuperacao-mobile.js', 'assert.equal(notifications,0);', "assert.equal(notifications,1);assert.equal(x.calls.filter(c=>c.rpc==='dados_cas').length,0);")
          replace('tests/test-sync-recuperacao-browser.js', "contentType:'text/html'", "contentType:'text/html; charset=utf-8'")
          replace('tests/test-sync-recuperacao-browser.js', '<html lang="pt-BR"><meta name="viewport"', '<html lang="pt-BR"><meta charset="utf-8"><meta name="viewport"')
          replace('tests/test-sync-recuperacao-browser.js', "  await page.locator('#mtSyncConflito').waitFor();", "  ok(await page.evaluate(()=>document.characterSet==='UTF-8'),width+': fixture usa UTF-8 como o Personal real');\n  await page.locator('#mtSyncConflito').waitFor();")
          p=Path('docs/releases/mt-v832-sync-mobile-sem-central-pro.md')
          p.write_text(p.read_text()+'\n## Ajustes após o primeiro CI\n\nO run `34765300350` bloqueou a publicação por duas verificações. O salvamento idêntico agora mantém a notificação única exigida pelo Personal, sem alterar timestamp, auditoria ou fila. A fixture do teste de navegador declara UTF-8 explicitamente, como a página real, evitando decodificação incorreta dos acentos no JavaScript. A asserção original do texto do aviso permanece, e foi acrescentada a verificação de `document.characterSet`. O novo HEAD precisa de nova execução integral dos checks antes do merge.\n')
          PY
      - name: Preparar dependências
        run: bash .github/scripts/setup-tests.sh
      - name: Testar lógica e recuperação no navegador real
        run: |
          set -euo pipefail
          node --check apps/store.js
          node tests/test-sync-cas.js
          node tests/test-sync-identidade.js
          node tests/test-sync-conflito-ui.js
          node tests/test-sync-recuperacao-mobile.js
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/torque-mobile-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/apps/store.js >/dev/null && break || sleep 1; done
          node tests/test-sync-recuperacao-browser.js
      - name: Registrar somente na branch isolada
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'codex/validar-sync-mobile-v832'
          git rm -- .github/workflows/validar-sync-mobile-v832.yml
          git add apps/store.js tests/test-sync-recuperacao-mobile.js tests/test-sync-recuperacao-browser.js docs/releases/mt-v832-sync-mobile-sem-central-pro.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preservar render de salvamento e fixture UTF-8 no CI'
          git push origin HEAD:refs/heads/codex/validar-sync-mobile-v832
