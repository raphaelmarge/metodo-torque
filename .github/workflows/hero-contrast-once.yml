name: Conferir contraste da foto mt-v817
on:
  push:
    branches: [fix/aluno-hero-topo-full-bleed]
    paths: [.github/workflows/hero-contrast-once.yml]
permissions:
  contents: write
jobs:
  contraste:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ambiente dos testes existentes
        run: |
          npm ci --prefix tests/runtime --ignore-scripts --no-audit --no-fund
          npm install --no-save playwright
          bash .github/scripts/prepara-playwright-ci.sh
          npx playwright install --with-deps chromium
          sudo mkdir -p /opt/node22/lib/node_modules /opt/pw-browsers
          sudo ln -s "$PWD/node_modules/playwright" /opt/node22/lib/node_modules/playwright
          CHROME=$(node -e "console.log(require('playwright').chromium.executablePath())")
          sudo ln -s "$CHROME" /opt/pw-browsers/chromium
      - name: Contraste do subtitulo principal no tema claro
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('app/aluno-skin.js')
          data = p.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest() == '1758a5eaada1a74ca3046c6d67a85b30449db466'
          old = 'html.claro body.aluno-v793 #heroCarr .hsub{color:var(--one-muted)!important}'
          new = 'html.claro body.aluno-v793 #heroCarr :is(.hsub,#htSub){color:var(--one-muted)!important}'
          text = data.decode()
          assert text.count(old) == 1
          p.write_text(text.replace(old,new))
          p = Path('tests/test-aluno-hero-full-bleed.js')
          text = p.read_text()
          anchor = "      await page.evaluate(() => document.documentElement.classList.remove('claro'));"
          assert text.count(anchor) == 1
          line = "      ok(await page.locator('#htSub').evaluate(e => getComputedStyle(e).color==='rgb(102, 94, 115)'), name + ': subtítulo legível no degradê claro');\n"
          p.write_text(text.replace(anchor,line+anchor))
          PY
          node --check app/aluno-skin.js
          git diff --check
      - name: Regenerar demo e testar
        env:
          TZ: America/Sao_Paulo
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/hero-http.log 2>&1 &
          SRV=$!
          trap 'kill "$SRV" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8765/assets/versao.js >/dev/null && break; sleep .25; done
          node tools/demo-aluno/regen-demo.js
          node tests/test-aluno-hero-full-bleed.js
          node tests/test-aluno-inicio-experiencia.js
          node tests/test-versao.js
      - name: Salvar no branch isolado
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/aluno-skin.js demo-aluno.html tests/test-aluno-hero-full-bleed.js
          git diff --cached --check
          git commit -m 'fix(aluno): manter subtitulo legivel no tema claro'
          git push origin HEAD:refs/heads/fix/aluno-hero-topo-full-bleed
