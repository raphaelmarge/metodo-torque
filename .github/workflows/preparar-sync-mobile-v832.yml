name: Preparar correção móvel v832
on:
  push:
    branches: [codex/preparar-sync-mobile-v832]
permissions:
  contents: write
jobs:
  preparar:
    if: github.ref == 'refs/heads/codex/preparar-sync-mobile-v832'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Aplicar somente as substituições verificadas
        run: python3 .github/torque-mobile-v832/apply.py
      - name: Validar a lógica sem rede nem dados reais
        run: |
          set -euo pipefail
          node --check apps/store.js
          node --check assets/personal-torque-one.js
          node tests/test-sync-cas.js
          node tests/test-sync-identidade.js
          node tests/test-sync-conflito-ui.js
          node tests/test-sync-recuperacao-mobile.js
          node tests/test-personal-pro-suite.js
          node tests/test-versao.js
      - name: Registrar somente na branch de preparação
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'codex/preparar-sync-mobile-v832'
          git rm -r -- .github/torque-mobile-v832 .github/workflows/preparar-sync-mobile-v832.yml
          git add apps/store.js assets/personal-torque-one.js assets/versao.js sw.js app/app-sw.js tests/test-personal-pro-suite.js tests/test-torque-one-layout.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: recuperar nuvem no celular e retirar Central Pro (mt-v832)'
          git push origin HEAD:refs/heads/codex/preparar-sync-mobile-v832
