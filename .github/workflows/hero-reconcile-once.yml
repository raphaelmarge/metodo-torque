name: Conciliar foto no topo mt-v818
on:
  push:
    branches: [fix/aluno-hero-topo-full-bleed]
    paths: [.github/workflows/hero-reconcile-once.yml]
permissions:
  contents: write
jobs:
  conciliar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ambiente dos testes existentes
        run: |
          npm ci --prefix tests/runtime --ignore-scripts --no-audit --no-fund
          npm install --no-save playwright
          bash .github/scripts/prepara-playwright-ci.sh
          npx playwright install --with-deps chromium
          sudo mkdir -p /opt/node22/lib/node_modules /opt/pw-browsers
          sudo ln -s "$PWD/node_modules/playwright" /opt/node22/lib/node_modules/playwright
          CHROME=$(node -e "console.log(require('playwright').chromium.executablePath())")
          sudo ln -s "$CHROME" /opt/pw-browsers/chromium
      - name: Preservar a main publicada e acrescentar o topo full-bleed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          def sha(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          old = subprocess.check_output(['git','show','0aa9e3a41b667f4770115061c858426d90970c53:app/aluno-skin.js']).decode()
          start = old.index('  /* v817 — Foto no topo')
          end = old.index('  var js = "";',start)
          addition = old[start:end].replace('v817 — Foto no topo','v818 — Foto no topo')
          p=Path('app/aluno-skin.js'); data=p.read_bytes()
          assert sha(data)=='b4e539707e5419d2e99d12651405e31bf4cccbc3'
          text=data.decode(); anchor='  var js = "";'
          assert text.count(anchor)==1
          p.write_text(text.replace(anchor,addition+anchor))
          # A v817 simultânea ampliou o desktop para 420px; conservar essa publicação.
          p=Path('tests/test-aluno-hero-full-bleed.js'); text=p.read_text()
          assert text.count('Math.abs(g.card.h-400)')==1
          p.write_text(text.replace('Math.abs(g.card.h-400)','Math.abs(g.card.h-420)'))
          # Mantém o teste novo da main, atualizando sua geometria para o pedido full-bleed.
          p=Path('tests/test-aluno-inicio-experiencia.js'); data=p.read_bytes()
          assert sha(data)=='2d470c0d7c2ec3a050db0bee307f9c5211d872c7'
          text=data.decode()
          before="Math.round(destaque.left)===16&&Math.round(destaque.width)===358&&Math.round(destaque.height)===420&&Math.round(destaque.imgWidth)===358&&Math.round(destaque.imgHeight)===420&&destaque.fit==='cover'"
          after="Math.round(destaque.left)===0&&Math.round(destaque.width)===390&&Math.round(destaque.height)===540&&Math.round(destaque.imgWidth)===390&&Math.round(destaque.imgHeight)===540&&destaque.fit==='cover'"
          assert text.count(before)==1
          p.write_text(text.replace(before,after).replace('foto grande ocupa o destaque superior inteiro em 390px, com as proporções anteriores','foto grande ocupa o topo de ponta a ponta em 390px, sem deformar'))
          for name in ('assets/versao.js','sw.js','app/app-sw.js'):
              p=Path(name); text=p.read_text(); assert text.count('mt-v817')==1
              p.write_text(text.replace('mt-v817','mt-v818'))
          p=Path('CLAUDE.md'); text=p.read_text()
          anchor='## v811 — Nutrição integrada ao Personal (adição solicitada pelo Raphael)'
          assert text.count(anchor)==1
          note='''## v818 — Foto no topo de ponta a ponta

          - Complementa a publicação simultânea v817: no celular (até 800px), a foto começa no topo e ocupa toda a largura do app, sem margens ou cantos de cartão. Saudação, sino e avatar ficam sobre a imagem, com safe area e contraste nos dois temas.
          - Mantém a altura restaurada de 470–570px com svh e fallback vh, imagem em cover e degradê para o fundo. Carrossel, destinos, Minha semana e hábitos continuam iguais.
          - A composição desktop publicada pela v817 (420px) permanece. Preservar também o primeiro dia sem treino e o fallback sem foto.
          - Somente skin, demo, versão/caches e testes; nenhuma alteração de builder, pacotes, sincronização ou Supabase. Demo regenerada pelo gerador canônico.
          - `test-aluno-hero-full-bleed.js` cobre 66 verificações. O teste de geometria adicionado simultaneamente em `test-aluno-inicio-experiencia.js` acompanha o topo full-bleed sem remover as verificações de foto ou fluxo.

          '''
          # Remove só a indentação do bloco Python no YAML, mantendo o documento original.
          note='\n'.join(line[10:] if line.startswith('          ') else line for line in note.split('\n'))
          p.write_text(text.replace(anchor,note+anchor))
          PY
          node --check app/aluno-skin.js
          git diff --check
      - name: Regenerar demo e conferir a conciliacao
        env:
          TZ: America/Sao_Paulo
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/hero-http.log 2>&1 &
          SRV=$!
          trap 'kill "$SRV" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8765/assets/versao.js >/dev/null && break; sleep .25; done
          node tools/demo-aluno/regen-demo.js
          node tests/test-aluno-hero-full-bleed.js
          node tests/test-aluno-inicio-experiencia.js
          node tests/test-versao.js
      - name: Salvar somente no branch de revisao
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/aluno-skin.js demo-aluno.html tests/test-aluno-hero-full-bleed.js tests/test-aluno-inicio-experiencia.js assets/versao.js sw.js app/app-sw.js CLAUDE.md
          git diff --cached --check
          git commit -m 'fix(aluno): conciliar topo full-bleed com a main publicada (mt-v818)'
          git push origin HEAD:refs/heads/fix/aluno-hero-topo-full-bleed
