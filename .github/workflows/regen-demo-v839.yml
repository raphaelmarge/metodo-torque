name: Gerar demo do aluno v839

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/regen-demo-v839.yml'

permissions:
  contents: read

jobs:
  gerar:
    if: github.event.pull_request.number == 848
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preparar Chromium do projeto
        run: bash .github/scripts/setup-tests.sh
      - name: Regenerar demos pelo builder canônico
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$GITHUB_WORKSPACE" >"$RUNNER_TEMP/demo-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --max-time 5 http://127.0.0.1:8765/personal.html >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              cat "$RUNNER_TEMP/demo-server.log" >&2
              exit 1
            fi
            sleep 1
          done
          node tools/demo-aluno/regen-demo.js
          mkdir -p "$RUNNER_TEMP/demo-aluno-v839"
          cp demo-aluno.html demo-aluno-sem-cadastro.html demo-aluno-cadastro.html "$RUNNER_TEMP/demo-aluno-v839/"
          sha256sum "$RUNNER_TEMP"/demo-aluno-v839/*.html > "$RUNNER_TEMP/demo-aluno-v839/SHA256SUMS"
      - name: Guardar demos regeneradas
        uses: actions/upload-artifact@v4
        with:
          name: demo-aluno-v839-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/demo-aluno-v839/
          if-no-files-found: error
          retention-days: 1
