name: Corrigir validação da ajuda v834
on:
  push:
    branches: [codex/corrigir-ci-ajuda-v834]
permissions:
  contents: write
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: America/Sao_Paulo
      BASE_URL: http://127.0.0.1:8765
      MT_BASE: http://127.0.0.1:8765
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Aplicar somente a correção da fonte verificada
        run: python3 .github/ci-ajuda-v834/apply.py
      - name: Preparar dependências versionadas
        run: bash .github/scripts/setup-tests.sh
      - name: Conferir ajuda real, infraestrutura e versão
        shell: bash
        run: |
          set -euo pipefail
          export TORQUE_EVIDENCE_DIR="$RUNNER_TEMP/correcao-ajuda-v834"
          mkdir -p "$TORQUE_EVIDENCE_DIR"
          python3 -m http.server 8765 --bind 127.0.0.1 > "$TORQUE_EVIDENCE_DIR/servidor.log" 2>&1 &
          SRV=$!
          trap 'kill "$SRV" 2>/dev/null || true' EXIT
          for n in $(seq 1 40); do
            if curl --fail --silent "$BASE_URL/assets/versao.js" >/dev/null; then break; fi
            sleep .25
          done
          curl --fail --silent "$BASE_URL/assets/versao.js" >/dev/null
          node --check tests/test-personal.js
          node --check tests/test-ajuda-atualizada-ui.js
          node tests/test-ajuda-atualizada-core.js 2>&1 | tee "$TORQUE_EVIDENCE_DIR/conteudo.log"
          timeout 240 node tests/test-ajuda-atualizada-ui.js 2>&1 | tee "$TORQUE_EVIDENCE_DIR/interface.log"
          timeout 240 node tests/test-infra.js 2>&1 | tee "$TORQUE_EVIDENCE_DIR/infra.log"
          node tests/test-versao.js 2>&1 | tee "$TORQUE_EVIDENCE_DIR/versao.log"
      - name: Guardar evidências sintéticas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: correcao-ajuda-v834-${{ github.run_id }}
          path: ${{ runner.temp }}/correcao-ajuda-v834/
          retention-days: 7
      - name: Registrar apenas na branch de preparação
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'codex/corrigir-ci-ajuda-v834'
          python3 .github/ci-ajuda-v834/apply.py --check
          git rm -r -- .github/ci-ajuda-v834 .github/workflows/corrigir-ci-ajuda-v834.yml
          git add personal.html tests/test-personal.js tests/test-ajuda-atualizada-core.js tests/test-ajuda-atualizada-ui.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: corrigir orientação da Loja e contrato dos testes de ajuda'
          git push origin HEAD:refs/heads/codex/corrigir-ci-ajuda-v834
