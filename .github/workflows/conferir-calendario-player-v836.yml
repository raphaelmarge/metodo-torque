name: Conferir calendário das referências v836
on:
  push:
    branches: [codex/preparar-player-referencias-v836]
permissions:
  contents: write
jobs:
  preparar:
    if: github.ref == 'refs/heads/codex/preparar-player-referencias-v836'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recusar datas inexistentes, sem normalizar histórico
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('app/aluno-builder.js')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='8e0a6de14c4db07d4dbc3174acb3acee1dfc7367575ec5dbe42e681aefbcaa3c'
          s=p.read_text();a="        return !last || r.d >= last.d ? r : last;"
          assert s.count(a)==1
          p.write_text(s.replace(a,"        if (new Date(r.d + 'T12:00:00Z').toISOString().slice(0, 10) !== r.d) return last;\n"+a))
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='4b92987b472ca0266e57313e501d2624f2da6b3193fe569a097b926957ba9c11'
          p=Path('tests/test-aluno-referencias-core.js')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='4b465e66a32255c3a2a1d9707623e9f89f5e600e47770204d587ba2120b9978b'
          s=p.read_text();a="console.log(n+' verificações do contexto por série passaram.');"
          extra="const calendar=setup([row('2026-01-31',10,8),row('2026-02-31',999,8),row('2026-02-29',999,8)]);\nok(calendar.ctx.SR.anterior(calendar.it,0).kg===10,'Data normalizada pelo JavaScript não transforma dia inexistente em referência');\nconst leap=setup([row('2024-02-28',10,8),row('2024-02-29',12,8)]);\nok(leap.ctx.SR.anterior(leap.it,0).kg===12,'Dia válido de ano bissexto continua aceito');\n"
          assert s.count(a)==1;p.write_text(s.replace(a,extra+a))
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='45471d6cc66c7a41d608d756941fb9d0d3cdefb490b159513f28191bd07f831b'
          PY
      - run: bash .github/scripts/setup-tests.sh
      - name: Validar e regenerar as demos
        env:
          CHROMIUM_PATH: /opt/pw-browsers/chromium
          TZ: America/Sao_Paulo
          BASE_URL: http://127.0.0.1:8765
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v836"
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/v836/server.log" 2>&1 &
          SERVER=$!
          trap 'kill "$SERVER" 2>/dev/null || true' EXIT
          for i in 1 2 3 4 5; do curl -fsS http://127.0.0.1:8765/assets/versao.js >/dev/null && break; sleep 1; done
          {
            node tests/test-aluno-referencias-core.js
            node tests/test-aluno-referencias-ui.js
            node tests/test-aluno-series-praticas.js
            node tests/test-aluno-player-experiencia.js
            node tools/demo-aluno/regen-demos.js
            node tests/test-demo-aluno-variantes.js
            node tests/test-demo-entrada-direta.js
            node tests/test-versao.js
          } 2>&1 | tee "$RUNNER_TEMP/v836/targeted.log"
      - name: Registrar apenas nesta preparação
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'codex/preparar-player-referencias-v836'
          git rm -- .github/workflows/conferir-calendario-player-v836.yml
          git add app/aluno-builder.js tests/test-aluno-referencias-core.js demo-aluno.html demo-aluno-cadastro.html demo-aluno-sem-cadastro.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: validar calendário das cargas anteriores sem inventar datas'
          git push origin HEAD:refs/heads/codex/preparar-player-referencias-v836
          git rev-parse HEAD > "$RUNNER_TEMP/v836/commit.txt"
          git archive --format=tar HEAD -o "$RUNNER_TEMP/v836/source.tar"
      - name: Evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-calendario-v836-${{ github.run_id }}
          path: ${{ runner.temp }}/v836/
          retention-days: 7
