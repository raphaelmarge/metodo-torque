name: Validar marca final v834
on:
  push:
    branches: [codex/refinar-marca-v834]
permissions:
  contents: write
jobs:
  marca:
    if: github.ref == 'refs/heads/codex/refinar-marca-v834'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: America/Sao_Paulo
      BASE_URL: http://127.0.0.1:8765
      MT_BASE: http://127.0.0.1:8765
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Aplicar alterações e conferir hashes da fonte
        run: |
          python3 .github/marca-v834/apply.py
          python3 .github/marca-v834/refine.py
      - name: Preparar dependências versionadas
        run: bash .github/scripts/setup-tests.sh
      - name: Núcleo, interface, recibo, mobile e isolamento entre tokens
        shell: bash
        run: |
          set -euo pipefail
          export TORQUE_EVIDENCE_DIR="$RUNNER_TEMP/marca-v834"
          mkdir -p "$TORQUE_EVIDENCE_DIR"
          node tests/test-identidade-marca-core.js 2>&1 | tee "$TORQUE_EVIDENCE_DIR/core.log"
          timeout 240 node tests/test-identidade-marca-ui.js 2>&1 | tee "$TORQUE_EVIDENCE_DIR/ui.log"
      - name: Regenerar demo canônica e testar integrações
        shell: bash
        run: |
          set -euo pipefail
          export TORQUE_EVIDENCE_DIR="$RUNNER_TEMP/marca-v834"
          python3 -m http.server 8765 --bind 127.0.0.1 >"$TORQUE_EVIDENCE_DIR/server.log" 2>&1 &
          SRV=$!
          trap 'kill "$SRV" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8765/assets/versao.js >/dev/null && break || sleep .25; done
          node tools/demo-aluno/regen-demo.js 2>&1 | tee "$TORQUE_EVIDENCE_DIR/demo.log"
          if grep -q 'PAGEERROR:' "$TORQUE_EVIDENCE_DIR/demo.log"; then exit 1; fi
          for test in tests/test-aluno-hero-full-bleed.js tests/test-demo-aluno-variantes.js tests/test-app-sintaxe.js tests/test-personal-estornos-core.js tests/test-personal-estornos-ui.js tests/test-recebimentos-v826.js tests/test-ferramentas-experiencia.js tests/test-versao.js tests/test-sync-cas.js; do
            echo "===== $test =====" | tee -a "$TORQUE_EVIDENCE_DIR/integracoes.log"
            timeout 240 node "$test" 2>&1 | tee -a "$TORQUE_EVIDENCE_DIR/integracoes.log"
          done
          git diff --check
      - name: Guardar evidências sintéticas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: identidade-final-v834-${{ github.run_id }}
          path: ${{ runner.temp }}/marca-v834/
          retention-days: 7
      - name: Registrar somente na branch isolada
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'codex/refinar-marca-v834'
          git rm -r -- .github/marca-v834 .github/workflows/preparar-marca-v834.yml .github/workflows/refinar-marca-v834.yml
          git add personal.html app/aluno-builder.js app/index.html app/app-sw.js assets/personal-estornos.js assets/personal-ferramentas.js sw.js demo-aluno.html tests/test-identidade-marca-ui.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: identidade do estúdio ou profissional integrada ao aluno v834'
          git push origin HEAD:refs/heads/codex/refinar-marca-v834
