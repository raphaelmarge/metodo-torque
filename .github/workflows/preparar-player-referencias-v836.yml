name: Preparar referências do player v836
on:
  push:
    branches: [codex/preparar-player-referencias-v836]
permissions:
  contents: write
jobs:
  preparar:
    if: github.ref == 'refs/heads/codex/preparar-player-referencias-v836'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 .github/v836/apply.py
      - run: bash .github/scripts/setup-tests.sh
      - name: Testar player e demos sem dados reais
        env:
          CHROMIUM_PATH: /opt/pw-browsers/chromium
          TZ: America/Sao_Paulo
          BASE_URL: http://127.0.0.1:8765
          ART_DIR: ${{ runner.temp }}/v836/imagens
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v836"
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/v836/server.log" 2>&1 &
          SERVER=$!
          trap 'kill "$SERVER" 2>/dev/null || true' EXIT
          for i in 1 2 3 4 5; do curl -fsS http://127.0.0.1:8765/assets/versao.js >/dev/null && break; sleep 1; done
          {
            node --check app/aluno-builder.js
            node --check app/aluno-skin.js
            node tests/test-aluno-referencias-core.js
            node tests/test-aluno-referencias-ui.js
            node tests/test-aluno-series-praticas.js
            node tests/test-aluno-player-experiencia.js
            node tools/demo-aluno/regen-demos.js
            node tests/test-demo-aluno-variantes.js
            node tests/test-demo-entrada-direta.js
            node tests/test-sync-cas.js
            node tests/test-versao.js
          } 2>&1 | tee "$RUNNER_TEMP/v836/targeted.log"
      - name: Registrar apenas nesta preparação
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'codex/preparar-player-referencias-v836'
          git rm -r -- .github/v836 .github/workflows/preparar-player-referencias-v836.yml
          git add app/aluno-builder.js app/aluno-skin.js assets/versao.js sw.js app/app-sw.js demo-aluno.html demo-aluno-cadastro.html demo-aluno-sem-cadastro.html tests/test-aluno-referencias-core.js tests/test-aluno-referencias-ui.js docs/releases/mt-v836-player-referencias.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: separar prescrição, histórico e confirmação no player (mt-v836)'
          git push origin HEAD:refs/heads/codex/preparar-player-referencias-v836
          git rev-parse HEAD > "$RUNNER_TEMP/v836/commit.txt"
          git archive --format=tar HEAD -o "$RUNNER_TEMP/v836/source.tar"
      - name: Evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-referencias-v836-${{ github.run_id }}
          path: ${{ runner.temp }}/v836/
          retention-days: 7
