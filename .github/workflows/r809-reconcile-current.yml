name: R809 reconcile current main
on:
  push:
    branches: [fix/relatorio-0809-completo]
    paths: [.github/workflows/r809-reconcile-current.yml]
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Reconcile current production
        run: |
          set -euxo pipefail
          git fetch origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit --no-ff origin/main
          # mt-v822 is already live from PR #827; this release becomes mt-v823.
          sed -i 's/mt-v822/mt-v823/g' assets/versao.js sw.js app/app-sw.js
          git add -A
          # Check only the report/release runtime changes. Current main already contains
          # a historical EOF-whitespace warning in test-release-workflow.js.
          git diff --cached --check -- assets/versao.js sw.js app/app-sw.js personal.html app/aluno-builder.js app/aluno-skin.js assets/relatorio-0809.css assets/relatorio-0809.js migrations/20260911_agenda_modalidade_v822.sql supabase-setup.sql tests/test-relatorio-0809-browser.js tests/test-relatorio-0809-core.js tests/test-relatorio-0809-sql.js
          git commit -m 'merge: reconcile report release with current main as mt-v823'
          git push origin HEAD:fix/relatorio-0809-completo
