name: R809 reconcile current main
on:
  push:
    branches: [fix/relatorio-0809-completo]
    paths: [.github/workflows/r809-reconcile-current.yml]
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Reconcile current production
        run: |
          set -euxo pipefail
          git fetch origin main
          BASE=$(git merge-base HEAD origin/main)
          echo "merge-base=$BASE main=$(git rev-parse origin/main) head=$(git rev-parse HEAD)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git merge --no-commit --no-ff origin/main; then
            git status --short
            # Current main owns release infrastructure/questionnaire retry changes.
            # Report owns its dedicated integration assets. For shared runtime files,
            # keep report side then reapply only the current-main delta from the old base.
            for f in assets/versao.js sw.js app/app-sw.js; do git checkout --ours -- "$f"; done
            # Preserve current CI/release files if they conflict.
            for f in .github/workflows/testes.yml .github/workflows/tests.yml .github/workflows/pages.yml package-lock.json release-info.json; do
              git checkout --theirs -- "$f" 2>/dev/null || true
            done
            # personal.html may contain both questionnaire and report changes: abort rather than guess.
            if git diff --name-only --diff-filter=U | grep -q '^personal.html$'; then
              echo 'personal.html conflict requires semantic reconciliation'; exit 42
            fi
            test -z "$(git diff --name-only --diff-filter=U)"
          fi
          # mt-v822 is already live from PR #827; this release becomes mt-v823.
          sed -i 's/mt-v822/mt-v823/g' assets/versao.js sw.js app/app-sw.js
          git add -A
          git diff --cached --check
          git commit -m 'merge: reconcile report release with current main as mt-v823'
          git push origin HEAD:fix/relatorio-0809-completo
