name: Gerar duas demos do aluno
on:
  push:
    branches: [feat/dois-demos-aluno]
    paths:
      - tools/demo-aluno/regen-demos.js
      - tests/test-demo-aluno-variantes.js
      - .github/workflows/gera-dois-demos-aluno-once.yml
permissions:
  contents: write
jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preparar Playwright com Chrome do runner
        run: |
          npm ci --prefix tests/runtime --ignore-scripts --no-audit --no-fund
          npm install --no-save playwright
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          test -n "$CHROME"
          sudo mkdir -p /opt/pw-browsers
          sudo ln -sf "$CHROME" /opt/pw-browsers/chromium
          "$CHROME" --version
      - name: Gerar as duas variantes
        env:
          TZ: America/Sao_Paulo
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/demo-http.log 2>&1 &
          SRV=$!
          trap 'kill "$SRV" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8765/personal.html >/dev/null && break; sleep .25; done
          node tools/demo-aluno/regen-demos.js
          node tests/test-demo-aluno-variantes.js
          git diff --check
      - name: Salvar demos geradas no branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '418982982+github-actions[bot]@users.noreply.github.com'
          git add demo-aluno.html demo-aluno-cadastro.html demo-aluno-direto.html
          git diff --cached --quiet && exit 0
          git commit -m 'feat(demo): gerar versões do aluno com e sem cadastro inicial'
          git push origin HEAD:refs/heads/feat/dois-demos-aluno
