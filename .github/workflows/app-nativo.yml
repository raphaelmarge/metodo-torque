name: App nativo Android

# Compila o app nativo (Capacitor) na nuvem do GitHub — sem precisar de
# Android Studio no seu computador. Rode manualmente na aba Actions
# ("Run workflow"), escolhendo o produto e o tipo de pacote:
#   apk = instala direto no celular pra testar
#   aab = arquivo assinado que sobe na Google Play (precisa dos Secrets)
on:
  workflow_dispatch:
    inputs:
      produto:
        description: "Qual app compilar"
        type: choice
        options: [academia, personal, nutri, aluno]
        default: personal
      pacote:
        description: "apk (testar no celular) ou aab (subir na Play)"
        type: choice
        options: [apk, aab]
        default: apk
  push:
    branches: [main]
    paths: ["nativo/**", ".github/workflows/app-nativo.yml"]

permissions:
  contents: write   # publica o APK de teste numa Release (link que abre no celular)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar o Capacitor
        working-directory: nativo
        run: npm install --no-audit --no-fund

      - name: Montar o app do produto escolhido
        run: node nativo/prepara.js "${{ inputs.produto || 'academia' }}"

      - name: Criar o projeto Android
        working-directory: nativo
        run: |
          npx cap add android
          npx cap sync android

      - name: Permissões que as lojas exigem (câmera, notificações)
        run: node nativo/ajusta-nativo.js android

      - name: Ícone e splash nativos
        working-directory: nativo
        run: >
          npx --yes @capacitor/assets generate --android --assetPath assets
          --iconBackgroundColor '#121016' --iconBackgroundColorDark '#121016'
          --splashBackgroundColor '#121016' --splashBackgroundColorDark '#121016'
          || echo "seguindo com os ícones padrão"

      - name: Compilar o APK (debug — instala direto no celular)
        if: ${{ (inputs.pacote || 'apk') == 'apk' }}
        working-directory: nativo/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # ----- pacote assinado pra Google Play -----
      # Precisa de 4 Secrets no repositório (Settings → Secrets and variables →
      # Actions): ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_SENHA,
      # ANDROID_KEY_ALIAS e ANDROID_KEY_SENHA. Sem eles, use o pacote "apk".
      - name: Recriar a chave de assinatura
        if: ${{ inputs.pacote == 'aab' }}
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "::error::Faltam os Secrets da assinatura — veja PUBLICAR-NAS-LOJAS.md"
            exit 1
          fi
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > nativo/android/torque.keystore

      - name: Compilar o AAB assinado (sobe na Play)
        if: ${{ inputs.pacote == 'aab' }}
        working-directory: nativo/android
        env:
          MT_KS_SENHA: ${{ secrets.ANDROID_KEYSTORE_SENHA }}
          MT_KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MT_KEY_SENHA: ${{ secrets.ANDROID_KEY_SENHA }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$PWD/torque.keystore \
            -Pandroid.injected.signing.store.password="$MT_KS_SENHA" \
            -Pandroid.injected.signing.key.alias="$MT_KS_ALIAS" \
            -Pandroid.injected.signing.key.password="$MT_KEY_SENHA"

      - name: Apagar a chave da máquina
        if: ${{ always() && inputs.pacote == 'aab' }}
        run: rm -f nativo/android/torque.keystore

      # O artefato do Actions só baixa quem está logado no GitHub — no celular
      # isso não acontece. A Release é pública: o link abre direto no navegador
      # do telefone e instala.
      - name: Publicar o APK de teste numa Release
        if: ${{ (inputs.pacote || 'apk') == 'apk' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PROD: ${{ inputs.produto || 'academia' }}
        run: |
          cp nativo/android/app/build/outputs/apk/debug/app-debug.apk "torqueon-$PROD.apk"
          gh release create "teste-$PROD" --title "Teste — TORQUE ON ($PROD)" \
            --notes "APK de teste do app nativo. Baixe no Android, toque no arquivo e permita a instalação desta fonte. Não serve para a Play Store (lá vai o .aab assinado)." \
            --latest=false 2>/dev/null || true
          gh release upload "teste-$PROD" "torqueon-$PROD.apk" --clobber
          echo "APK em https://github.com/${{ github.repository }}/releases/download/teste-$PROD/torqueon-$PROD.apk"

      - name: Publicar o pacote como artefato
        uses: actions/upload-artifact@v4
        with:
          name: torqueon-${{ inputs.produto || 'academia' }}-${{ inputs.pacote || 'apk' }}
          path: |
            nativo/android/app/build/outputs/apk/debug/app-debug.apk
            nativo/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
