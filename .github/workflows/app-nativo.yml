name: App nativo Android

# Compila o APK nativo (Capacitor) na nuvem do GitHub — sem precisar de
# Android Studio no seu computador. Rode manualmente na aba Actions
# ("Run workflow") ou automaticamente quando a pasta nativo/ mudar.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["nativo/**", ".github/workflows/app-nativo.yml"]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar o Capacitor
        working-directory: nativo
        run: npm install --no-audit --no-fund

      - name: Montar o miolo do app (www)
        working-directory: nativo
        run: node copia-www.js

      - name: Criar o projeto Android
        working-directory: nativo
        run: |
          npx cap add android
          npx cap sync android

      - name: Ícone e splash nativos
        working-directory: nativo
        run: >
          npx --yes @capacitor/assets generate --android --assetPath assets
          --iconBackgroundColor '#121016' --iconBackgroundColorDark '#121016'
          --splashBackgroundColor '#121016' --splashBackgroundColorDark '#121016'
          || echo "seguindo com os ícones padrão"

      - name: Compilar o APK (debug — instala direto no celular)
        working-directory: nativo/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publicar o APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: torqueon-academia-apk
          path: nativo/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
