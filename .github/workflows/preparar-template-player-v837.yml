name: Conferir contraste do template v837
on:
  push:
    branches: [codex/preparar-template-player-v837]
permissions:
  contents: write
jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: http://127.0.0.1:8765
      CHROMIUM_PATH: /opt/pw-browsers/chromium
      TORQUE_PREVIEW_MEMORY: '0'
      TORQUE_SCREENSHOTS: /tmp/torque-template-evidencias/imagens
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Aplicar ajuste verificado
        run: |
          python3 .github/torque-template-v837/contrast.py
          node --check app/aluno-skin.js
      - name: Preparar dependências canônicas
        run: bash .github/scripts/setup-tests.sh
      - name: Conferir interface, dados e demos
        run: |
          set -euo pipefail
          mkdir -p /tmp/torque-template-evidencias
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/torque-template-evidencias/server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || :' EXIT
          for n in $(seq 1 40); do curl -fsS "$BASE_URL/assets/versao.js" >/dev/null && break; sleep .25; done
          {
            node tests/test-aluno-template-player.js
            node tests/test-aluno-referencias-core.js
            node tests/test-sync-cas.js
            node tools/demo-aluno/regen-demo.js
            node tests/test-demo-entrada-direta.js
            node tests/test-demo-aluno-variantes.js
            node tests/test-versao.js
          } 2>&1 | tee /tmp/torque-template-evidencias/targeted.log
      - name: Registrar somente na preparação
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = codex/preparar-template-player-v837
          git rm -r -- .github/torque-template-v837 .github/workflows/preparar-template-player-v837.yml
          git add app/aluno-skin.js tests/test-aluno-template-player.js demo-aluno.html demo-aluno-sem-cadastro.html demo-aluno-cadastro.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preservar contraste no tema claro do player v837'
          git push origin HEAD:refs/heads/codex/preparar-template-player-v837
          git rev-parse HEAD > /tmp/torque-template-evidencias/commit.txt
          git archive HEAD > /tmp/torque-template-evidencias/source.tar
      - name: Guardar evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: template-contraste-v837-${{ github.run_id }}
          path: /tmp/torque-template-evidencias/
          retention-days: 7
