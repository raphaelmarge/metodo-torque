name: Fix sync conflict UI
on:
  push:
    branches:
      - fix/sync-conflict-dismissible
    paths:
      - .github/workflows/fix-sync-conflict-ui-once.yml
      - tools/apply-sync-conflict-ui.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply and test
        run: |
          python3 tools/apply-sync-conflict-ui.py
          node --check apps/store.js
          node tests/test-sync-conflito-ui.js
          node tests/test-sync-cas.js
          node tests/test-sync-identidade.js
          node tests/test-versao.js
          git diff --check
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/store.js tests/test-sync-conflito-ui.js assets/versao.js sw.js app/app-sw.js
          git diff --cached --check
          git commit -m "fix(sync): permitir fechar aviso sem remover proteção (mt-v819)"
          git push origin HEAD:refs/heads/fix/sync-conflict-dismissible
