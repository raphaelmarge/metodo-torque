name: Validar foco dos calendarios v821
on:
  push:
    branches: [feat/alimentacao-calendario-horarios]
    paths:
      - .github/workflows/calendar-focus-once.yml
      - tools/calendar-focus-once.py
permissions:
  contents: write
concurrency:
  group: calendar-v821-focus
  cancel-in-progress: false
jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Aplicar ajuste revisado e conferir hashes
        run: |
          python3 tools/calendar-focus-once.py
          node --check app/aluno-builder.js
          git diff --check
      - name: Ambiente das suites existentes
        run: |
          npm ci --prefix tests/runtime --ignore-scripts --no-audit --no-fund
          npm install --no-save playwright
          bash .github/scripts/prepara-playwright-ci.sh
          npx playwright install --with-deps chromium
          sudo mkdir -p /opt/node22/lib/node_modules /opt/pw-browsers
          sudo ln -s "$PWD/node_modules/playwright" /opt/node22/lib/node_modules/playwright
          CHROME=$(node -e "console.log(require('playwright').chromium.executablePath())")
          sudo ln -s "$CHROME" /opt/pw-browsers/chromium
      - name: Regenerar demos e validar foco, navegacao e dados
        env:
          TZ: America/Sao_Paulo
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/calendar-http.log 2>&1 &
          SRV=$!
          trap 'kill "$SRV" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8765/assets/versao.js >/dev/null && break; sleep .25; done
          node tools/demo-aluno/regen-demos.js
          for t in test-calendario-alimentacao test-calendario-alimentacao-editor test-aluno-evolucao-experiencia test-nutricao-navegacao test-nutricao-integrada test-aluno-inicio-experiencia test-sync-cas test-sync-identidade test-demo-aluno-variantes test-versao; do
            timeout 300 node "tests/$t.js"
          done
          git diff --check
      - name: Salvar apenas no branch do PR
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/aluno-builder.js tests/test-calendario-alimentacao.js tests/test-aluno-evolucao-experiencia.js demo-aluno.html demo-aluno-cadastro.html demo-aluno-sem-cadastro.html
          git diff --cached --check
          git commit -m 'fix(aluno): preservar foco ao navegar pelos meses do calendario'
          git push origin HEAD:refs/heads/feat/alimentacao-calendario-horarios
