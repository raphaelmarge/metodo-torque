name: Preparar cancelamentos e devoluções v834
on:
  push:
    branches: [codex/preparar-estornos-v834]
permissions:
  contents: write
jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: America/Sao_Paulo
      TORQUE_EVIDENCE_DIR: /tmp/torque-estornos-evidencias
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Aplicar patch conferido e validar os onze arquivos
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64,gzip,hashlib,subprocess
          pre={
            'personal.html':'ebd3ce0c93864c8bc48783db8217b3fe5f04429b6313e0e5b86c1f23c5853ce9',
            'assets/relatorio-0809.js':'4105150d509f2ac63e84a48b1d5231e176c8d7496d64434e9f77b91d32753df8',
            'assets/versao.js':'f8b9fbfce8478d854a5d914fdbad9f830195a929b8715c8cbd4c916f9704e64a',
            'sw.js':'ee0520a122b3caf0195a709cbcad9ab46c628849a5dd2a1a819b6982088a173a',
            'app/app-sw.js':'de09c923c45fb5c46647cf33c67c94b9bef03a783b0995bc42e04d838e4e7c45'}
          post={
            'personal.html':'2ea7abc3a713749e9dab6b38ed2993561817143a917b62d27e7a2b66c1a43682',
            'assets/relatorio-0809.js':'5829cd3fb58deaceba5aef5cd9154cb2004f0222e01af1dc72b6067f44b3f734',
            'assets/versao.js':'854f9c3e278d4179cac36fba78215079da66d56d0ddc2311153987f9ec8022ae',
            'sw.js':'e943071cf5daec307201bf0655bd161ec8d0c276aac35b17c4808f849eaa9559',
            'app/app-sw.js':'1529259d11660363423323ae1d96181c85ff5dd068a21177a89b9b913e8037cd',
            'assets/personal-estornos-core.js':'b76b164e14eead88bbeb84a858234cffcf600c605d7881d1094fd1ebc316d80c',
            'assets/personal-estornos.js':'b43863175f72e67d29a2e0b1887a34ffe330465d507192e73b5550c13098a25a',
            'assets/personal-estornos.css':'b4a068620bbbe6b27f0f120668b8870e54374fdbebfc65e3a33c8583b48875ad',
            'tests/test-personal-estornos-core.js':'8cd5349a51eec4606fca9de02eea78514e452aa5aa5e2e5be9c3f519e93a62d5',
            'tests/test-personal-estornos-ui.js':'43bea1f97f372f52898661f05e9fd8a7786fda8bbcb05e6c427fef17ce088bac',
            'docs/releases/mt-v834-cancelamentos-estornos.md':'2693d3fa9fd9c53de1acc177f11af1df9aea34b29698c8cc697c2a7f7f63274d'}
          for name,digest in pre.items():
            assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest, 'Base mudou: '+name
          compressed=base64.b64decode(Path('.github/estornos-v834.patch.gz.b64').read_text())
          assert hashlib.sha256(compressed).hexdigest()=='586e82766c4971a621b9238e6f45dbc458ba31842d730730fa1620efefecf084', 'Patch divergiu'
          patch=gzip.decompress(compressed)
          targets={line.split(' b/',1)[1] for line in patch.decode().splitlines() if line.startswith('diff --git ')}
          assert targets==set(pre), 'Escopo de patch divergente'
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          for name,digest in post.items():
            actual=hashlib.sha256(Path(name).read_bytes()).hexdigest()
            assert actual==digest, 'Arquivo divergiu: '+name+' '+actual
            print(actual,name)
          PY
          git diff --check
          node --check assets/personal-estornos-core.js
          node --check assets/personal-estornos.js
          node --check assets/relatorio-0809.js
          node - <<'JS'
          const fs=require('node:fs'),vm=require('node:vm');let n=0;
          for(const match of fs.readFileSync('personal.html','utf8').matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)){
            if(!match[1].trim())continue;new vm.Script(match[1]);n++;
          }
          console.log(n+' scripts inline válidos');
          JS
          node tests/test-versao.js
          node tests/test-personal-estornos-core.js
          node tests/test-sync-cas.js
          node tests/test-sync-identidade.js
          node tests/test-sync-recuperacao-mobile.js
      - name: Preparar dependências já versionadas
        run: bash .github/scripts/setup-tests.sh
      - name: Testar recebimentos anteriores e novos fluxos reais
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$TORQUE_EVIDENCE_DIR"
          node tests/test-recebimentos-v826.js 2>&1 | tee "$TORQUE_EVIDENCE_DIR/recebimentos.log"
          node tests/test-personal-estornos-ui.js 2>&1 | tee "$TORQUE_EVIDENCE_DIR/estornos.log"
      - name: Guardar evidências sintéticas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: estornos-v834-${{ github.run_id }}
          path: /tmp/torque-estornos-evidencias/
          if-no-files-found: ignore
          retention-days: 7
      - name: Registrar somente a branch de preparação após testes
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'codex/preparar-estornos-v834'
          git rm .github/estornos-v834.patch.gz.b64 .github/workflows/preparar-estornos-v834.yml
          git add personal.html assets/relatorio-0809.js assets/versao.js sw.js app/app-sw.js
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: integrar cancelamentos e devoluções manuais (mt-v834)'
          git push origin HEAD:refs/heads/codex/preparar-estornos-v834
