name: Preparar e validar player v838
on:
  push:
    branches: [prep/player-v838-flow-20260916]
    paths:
      - '.github/scripts/player-v838-fix.py'
      - '.github/workflows/preparar-player-v838.yml'
permissions:
  contents: write
jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_URL: http://127.0.0.1:8765
      MT_BASE: http://127.0.0.1:8765
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preparar dependências fixadas no repositório
        run: bash .github/scripts/setup-tests.sh
      - name: Aplicar correção e regenerar demos canônicas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/player-v838"
          python3 .github/scripts/player-v838-fix.py
          node --check app/aluno-skin.js
          node --check tests/helpers/player-template.js
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/player-v838/server.log" 2>&1 &
          for i in $(seq 1 40); do curl --fail --silent http://127.0.0.1:8765/assets/versao.js >/dev/null && break; sleep 0.25; done
          node tools/demo-aluno/regen-demo.js
          git rm .github/scripts/player-v838-fix.py .github/workflows/preparar-player-v838.yml
          git add app/aluno-skin.js tests/helpers/player-template.js tests/test-acompanhamento.js tests/test-aluno-player-experiencia.js tests/test-aluno-series-praticas.js tests/test-aluno-template-player.js assets/versao.js sw.js app/app-sw.js demo-aluno.html demo-aluno-cadastro.html demo-aluno-sem-cadastro.html docs/releases/mt-v838-player-publicacao.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: concluir treino no player aprovado e preservar o recibo (mt-v838)'
          git push origin HEAD:refs/heads/prep/player-v838-ready-${{ github.run_id }}
          git rev-parse HEAD > "$RUNNER_TEMP/player-v838/commit.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/player-v838/tree.txt"
          git diff --stat HEAD^ HEAD > "$RUNNER_TEMP/player-v838/changes.txt"
          git archive --format=tar HEAD > "$RUNNER_TEMP/player-v838/source.tar"
      - name: Validar player com armazenamento real e nuvem interceptada
        shell: bash
        env:
          TORQUE_SCREENSHOTS: ${{ runner.temp }}/player-v838/imagens
        run: |
          set -uo pipefail
          failures=0
          for file in tests/test-aluno-template-player.js tests/test-aluno-player-experiencia.js tests/test-aluno-series-praticas.js tests/test-acompanhamento.js tests/test-series-prescricao.js tests/test-aluno-referencias-core.js tests/test-aluno-referencias-ui.js tests/test-demo-aluno-variantes.js tests/test-sync-cas.js tests/test-versao.js; do
            name=$(basename "$file" .js)
            echo "===== $file ====="
            timeout 180 node "$file" > "$RUNNER_TEMP/player-v838/$name.log" 2>&1
            status=$?
            cat "$RUNNER_TEMP/player-v838/$name.log"
            echo "$name exit=$status" | tee -a "$RUNNER_TEMP/player-v838/resultados.txt"
            if [ "$status" -ne 0 ]; then failures=$((failures+1)); fi
          done
          echo "Suítes com falha: $failures"
          exit "$failures"
      - name: Guardar fonte e evidências, inclusive em falhas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-v838-${{ github.run_id }}
          path: ${{ runner.temp }}/player-v838/
          retention-days: 7
          if-no-files-found: warn
