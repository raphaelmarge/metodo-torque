name: Finalizar revisão mt-v807
on:
  push:
    branches:
      - reliability/mt-v807
permissions:
  contents: write
jobs:
  apply:
    if: ${{ contains(github.event.head_commit.message, '[v807-review]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar alterações revisadas somente nesta branch
        run: python3 tools/finalize-v807.py
      - name: Contratos locais antes de gravar
        run: |
          node tests/test-sync-cas.js
          node tests/test-sync-identidade.js
          node tests/test-sync-cas-sql.js
          node tests/test-versao.js
          git diff --check
      - name: Commit das alterações sem force push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A apps/store.js assets/personal-questionarios.css supabase-setup.sql tests/test-personal.js tests/test-questionarios-usabilidade.js tests/test-sync-cas.js tests/test-sync-identidade.js tools/finalize-v807.py tools/reliability-v807.py .github/workflows/reliability-v807-apply.yml
          git commit -m 'fix: CAS real, publicação isolada e questionários [v807-applied]'
          git push origin HEAD:reliability/mt-v807
