name: HQ - Auth e PostgREST descartaveis

on:
  pull_request:
    branches: [main]
    paths:
      - assets/hq-*.js
      - supabase/hq-*.sql
      - supabase/releases/**
      - supabase/functions/personal-billing*/**
      - supabase/functions/_shared/personal-billing*.mjs
      - supabase/functions/_shared/personal-pagarme.mjs
      - supabase/functions/_shared/personal-sales.mjs
      - supabase-setup.sql
      - supabase/migrations/*confiabilidade_interna*.sql
      - supabase/migrations/*onboarding_integridade_e_retorno_reservado*.sql
      - supabase/rollback/**
      - supabase/migrations/*hq_referrals*.sql
      - supabase/migrations/*personal_cortesia*.sql
      - supabase/migrations/*hq_operacao_estados_exportacao*.sql
      - supabase/migrations/*hq_suporte_legado_leitura*.sql
      - tests/test-personal-cortesia-sql.js
      - tests/test-personal-saas-*.js
      - tests/test-personal-billing*.js
      - tests/test-hq-*.js
      - tests/hq-auth-ci/**
      - tests/sql/**
      - tests/runtime/**
      - tools/hq-ops/**
      - .github/workflows/hq-auth.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hq-auth-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  auth-http:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HQ_TEST_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Confirmar o SHA efetivamente testado
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HQ_TEST_COMMIT"
          printf 'HQ_TEST_COMMIT=%s\n' "$HQ_TEST_COMMIT"
          printf '## Homologacao HQ\n\nCommit: `%s`\n\nSomente servicos descartaveis no runner; sem deploy ou banco remoto.\n' "$HQ_TEST_COMMIT" >> "$GITHUB_STEP_SUMMARY"
      - name: Instalar somente dependencias travadas dos testes SQL
        run: |
          npm ci --prefix tests/sql --ignore-scripts --no-audit --no-fund
          npm ci --prefix tests/runtime --ignore-scripts --no-audit --no-fund
      - name: Conferir pacotes versionados e reversao em banco efemero
        run: |
          node tests/test-hq-backend-activation.js
          node tests/test-hq-optional-suspension.js
          node tests/test-hq-unified-sql.js
          node tests/test-hq-team-registry-sql.js
          node tests/test-hq-team-activation.js
      - name: Homologar PostgreSQL concorrente e Auth/PostgREST reais
        shell: bash
        run: bash tests/hq-auth-ci/run.sh
