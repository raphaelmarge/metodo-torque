name: Preparar foto no topo mt-v817
on:
  push:
    branches: [fix/aluno-hero-topo-full-bleed]
    paths:
      - .github/workflows/hero-topo-once.yml
      - tools/restore-hero-topo.py
permissions:
  contents: write
concurrency:
  group: hero-topo-v817
  cancel-in-progress: false
jobs:
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preparar o mesmo ambiente das suites existentes
        run: |
          npm ci --prefix tests/runtime --ignore-scripts --no-audit --no-fund
          npm install --no-save playwright
          bash .github/scripts/prepara-playwright-ci.sh
          npx playwright install --with-deps chromium
          sudo mkdir -p /opt/node22/lib/node_modules /opt/pw-browsers
          sudo ln -s "$PWD/node_modules/playwright" /opt/node22/lib/node_modules/playwright
          CHROME=$(node -e "console.log(require('playwright').chromium.executablePath())")
          sudo ln -s "$CHROME" /opt/pw-browsers/chromium
      - name: Aplicar somente a alteracao visual revisada
        run: |
          python3 tools/restore-hero-topo.py
          node --check app/aluno-skin.js
          git diff --check
      - name: Regenerar demo e conferir o Inicio
        env:
          TZ: America/Sao_Paulo
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/hero-http.log 2>&1 &
          SRV=$!
          trap 'kill "$SRV" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8765/assets/versao.js >/dev/null && break; sleep .25; done
          node tools/demo-aluno/regen-demo.js
          node tests/test-aluno-hero-full-bleed.js
          node tests/test-aluno-inicio-experiencia.js
          node tests/test-versao.js
      - name: Salvar apenas no branch isolado, sem publicar main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/aluno-skin.js demo-aluno.html assets/versao.js sw.js app/app-sw.js CLAUDE.md
          git diff --cached --check
          git commit -m 'fix(aluno): restaurar foto grande no topo (mt-v817)'
          git push origin HEAD:refs/heads/fix/aluno-hero-topo-full-bleed
