name: Diagnóstico de confiabilidade interna
on:
  pull_request:
    branches: [main]
    paths:
      - apps/store*.js
      - assets/studio-patches.js
      - assets/personal-confiabilidade.js
      - personal.html
      - supabase/migrations/*confiabilidade_interna.sql
      - tests/*confiabilidade*
      - tests/test-studio-patches.js
      - tests/test-infra.js
      - tests/fixtures/confiabilidade.html
      - .github/scripts/setup-tests.sh
      - .github/workflows/confiabilidade.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  confiabilidade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: torque-test-only
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGTESTURL: postgresql://postgres:torque-test-only@127.0.0.1:55432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preparar Chromium e WebKit
        run: bash .github/scripts/setup-tests.sh
      - name: Testar cópias, concorrência e navegadores sem produção
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/torque-testes"
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/confiabilidade-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8765/tests/fixtures/confiabilidade.html >/dev/null; then break; fi
            sleep 0.25
          done
          node tests/test-studio-patches.js
          node tests/test-infra.js
          node tests/test-confiabilidade-sql.js
          node tests/test-confiabilidade-browser.js
          node tests/test-confiabilidade-webkit.js
      - name: Guardar evidências dos navegadores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: confiabilidade-${{ github.run_id }}
          path: ${{ runner.temp }}/torque-testes/
          if-no-files-found: warn
          retention-days: 7
