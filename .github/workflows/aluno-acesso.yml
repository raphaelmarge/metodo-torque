name: Diagnóstico de recuperação do aluno
on:
  pull_request:
    branches: [main]
    paths:
      - aluno-login.html
      - supabase/functions/aluno-recupera/**
      - supabase/migrations/*aluno_recuperacao_acesso.sql
      - tests/test-aluno-recuperacao-*.js
      - .github/workflows/aluno-acesso.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recuperacao:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preparar dependências canônicas
        run: bash .github/scripts/setup-tests.sh
      - name: Conferir acesso em navegador e SQL isolados
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/torque-testes"
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/aluno-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8765/aluno-login.html >/dev/null; then break; fi
            sleep 0.25
          done
          node tests/test-aluno-recuperacao-browser.js
          node tests/test-aluno-recuperacao-edge.js
          node tests/test-aluno-recuperacao-sql.js
      - name: Guardar captura da entrada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aluno-acesso-${{ github.run_id }}
          path: ${{ runner.temp }}/torque-testes/
          if-no-files-found: warn
          retention-days: 7
