name: Fontes para revisao dos calendarios
on:
  push:
    branches: [feat/alimentacao-calendario-horarios]
    paths: [.github/workflows/calendar-release-review-source.yml]
permissions:
  contents: read
jobs:
  fontes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Arquivar somente arquivos versionados dos commits revisados
        run: |
          mkdir -p "$RUNNER_TEMP/calendar-review"
          git archive --format=tar.gz -o "$RUNNER_TEMP/calendar-review/calendar-head.tar.gz" f91df575a762aa9b5ef0338f3525f86912f8ab5e
          git archive --format=tar.gz -o "$RUNNER_TEMP/calendar-review/main-base.tar.gz" 4d4e91be7fb16af905f933096d26d4445d8b8adc
          git archive --format=tar.gz -o "$RUNNER_TEMP/calendar-review/common-base.tar.gz" 81a912adb7644bffa1cd72400c766ddb581c1366
          cd "$RUNNER_TEMP/calendar-review"
          sha256sum *.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: calendar-release-review-source
          path: ${{ runner.temp }}/calendar-review
          retention-days: 1
          if-no-files-found: error
