name: Preparar fluxo Personal v833

on:
  push:
    branches: [codex/personal-fluxo-v833]

permissions:
  contents: write

jobs:
  preparar:
    if: github.ref == 'refs/heads/codex/personal-fluxo-v833'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Aplicar integração ao Personal
        run: python3 .github/ptflow-v833/apply.py
      - name: Validar sintaxe, versão e contratos estáticos
        run: |
          set -euo pipefail
          node --check assets/personal-fluxo.js
          node tests/test-versao.js
          node - <<'NODE'
          const fs=require('fs'),assert=require('assert/strict');
          const h=fs.readFileSync('personal.html','utf8');
          const j=fs.readFileSync('assets/personal-fluxo.js','utf8');
          const s=fs.readFileSync('sw.js','utf8');
          assert(h.includes('assets/personal-fluxo.js')&&h.includes('assets/personal-fluxo.css'));
          assert(h.includes('window.__perfilAtualPT'));
          assert(!j.includes('Central Pro'));
          assert(j.includes('personal_sessoes')&&j.includes('personal_automacoes')&&j.includes('personal_automacao_fila'));
          assert(s.includes('assets/personal-fluxo.js')&&s.includes('assets/personal-fluxo.css'));
          NODE
      - name: Registrar a árvore final e remover o preparador
        run: |
          set -euo pipefail
          git rm -r -- .github/ptflow-v833 .github/workflows/preparar-fluxo-v833.yml
          git add personal.html sw.js app/app-sw.js assets/versao.js assets/personal-fluxo.js assets/personal-fluxo.css tests/test-personal-fluxo.js docs/releases/mt-v833-fluxo-personal.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: integrar fluxo diário no Personal (mt-v833)'
          git push origin HEAD:refs/heads/codex/personal-fluxo-v833
