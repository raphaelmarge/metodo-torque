name: Testes (Playwright)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar Playwright
        run: |
          npm ci --prefix tests/runtime --ignore-scripts --no-audit --no-fund
          npm init -y >/dev/null
          npm i playwright@1 >/dev/null
          bash .github/scripts/prepara-playwright-ci.sh
          npx playwright install --with-deps chromium
          # Mesmos caminhos das suítes locais e do workflow testes.yml.
          sudo mkdir -p /opt/node22/lib/node_modules /opt/pw-browsers
          sudo ln -s "$PWD/node_modules/playwright" /opt/node22/lib/node_modules/playwright
          CHROME=$(node -e "console.log(require('playwright').chromium.executablePath())")
          sudo ln -s "$CHROME" /opt/pw-browsers/chromium
      - name: Rodar as suítes
        run: bash tests/run.sh
