name: Testes (Playwright)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      upload_pages:
        description: Empacotar para o deploy do mesmo run, somente na main
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preparar dependências dos testes
        run: bash .github/scripts/setup-tests.sh
      - name: Registrar dependências antes da suíte demorada
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/torque-dependencias"
          cp tests/ci/package.json tests/ci/package-lock.json "$RUNNER_TEMP/torque-dependencias/"
          git rev-parse HEAD > "$RUNNER_TEMP/torque-dependencias/commit.txt"
      - name: Guardar checkpoint das dependências
        uses: actions/upload-artifact@v4
        with:
          name: dependencias-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/torque-dependencias/
          if-no-files-found: error
          retention-days: 7
      - name: Rodar todas as suítes, sem repetição automática
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/torque-testes"
          git rev-parse HEAD > "$RUNNER_TEMP/torque-testes/commit.txt"
          bash tests/run.sh 2>&1 | tee "$RUNNER_TEMP/torque-testes/suites.log"
      - name: Empacotar somente o código versionado e aprovado
        id: pacote
        run: bash .github/scripts/prepare-pages.sh
      - name: Registrar evidências, inclusive em falhas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-testes-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/torque-testes/
          retention-days: 7
      - name: Disponibilizar o artefato aprovado para Pages
        if: ${{ success() && inputs.upload_pages && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.pacote.outputs.path }}
