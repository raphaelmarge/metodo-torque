name: Preparar estabilidade e demo v835
on:
  push:
    branches: [codex/preparar-estabilidade-demo-v835]
permissions:
  contents: write
jobs:
  preparar:
    if: github.ref == 'refs/heads/codex/preparar-estabilidade-demo-v835'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Aplicar somente alterações da base conferida
        run: python3 .github/v835/apply.py
      - name: Preparar ferramentas de teste versionadas
        run: bash .github/scripts/setup-tests.sh
      - name: Gerar as demos e conferir os fluxos sem produção
        env:
          CHROMIUM_PATH: /opt/pw-browsers/chromium
          TZ: America/Sao_Paulo
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v835"
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/v835/server.log" 2>&1 &
          SERVER=$!
          trap 'kill "$SERVER" 2>/dev/null || true' EXIT
          for i in 1 2 3 4 5; do curl -fsS http://127.0.0.1:8765/assets/versao.js >/dev/null && break; sleep 1; done
          {
            node --check assets/personal-questionarios.js
            node tools/demo-aluno/regen-demos.js
            node tests/test-questionarios-usabilidade.js
            node tests/test-questionarios-editor.js
            node tests/test-demo-aluno-variantes.js
            node tests/test-demo-entrada-direta.js
            node tests/test-sync-cas.js
            node tests/test-versao.js
          } 2>&1 | tee "$RUNNER_TEMP/v835/targeted.log"
      - name: Registrar somente na branch de preparação
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'codex/preparar-estabilidade-demo-v835'
          git rm -r -- .github/v835 .github/workflows/preparar-estabilidade-demo-v835.yml
          git add assets/personal-questionarios.js tests/test-questionarios-usabilidade.js tools/demo-aluno/regen-demo.js tools/demo-aluno/regen-demos.js tests/test-demo-aluno-variantes.js tests/test-demo-entrada-direta.js demo-aluno.html demo-aluno-cadastro.html demo-aluno-sem-cadastro.html assets/versao.js sw.js app/app-sw.js docs/releases/mt-v835-estabilidade-demo.md docs/roadmap-personal-2026-09.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: finalizar questionários sem timer e demo com entrada direta (mt-v835)'
          git push origin HEAD:refs/heads/codex/preparar-estabilidade-demo-v835
          git rev-parse HEAD > "$RUNNER_TEMP/v835/commit.txt"
          git archive --format=tar HEAD -o "$RUNNER_TEMP/v835/source.tar"
      - name: Evidências e fonte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: estabilidade-demo-v835-${{ github.run_id }}
          path: ${{ runner.temp }}/v835/
          retention-days: 7
