name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Não interromper uma publicação já iniciada com outro deploy concorrente.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validar:
    uses: ./.github/workflows/tests.yml
    with:
      upload_pages: true
  deploy:
    needs: validar
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Recusar publicação de código ultrapassado
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' });
            if (data.object.sha !== context.sha) {
              // O bot atualiza só este briefing na main com GITHUB_TOKEN, sem
              // disparar outro Pages. Não confundir documentação com código novo.
              const { data: comparison } = await github.request(
                'GET /repos/{owner}/{repo}/compare/{basehead}', {
                  ...context.repo, basehead: `${context.sha}...${data.object.sha}`,
                  page: 1, per_page: 1
                });
              const onlyBriefing = comparison.status === 'ahead' &&
                comparison.ahead_by > 0 && comparison.behind_by === 0 &&
                Array.isArray(comparison.files) && comparison.files.length === 1 &&
                comparison.files[0].filename === 'design/BRIEFING-CLAUDE-DESIGN.md' &&
                comparison.files[0].status === 'modified';
              if (!onlyBriefing) {
                core.setFailed('A main mudou além do briefing; validar o novo código antes de publicar.');
              } else {
                core.info('Somente o briefing avançou; o artefato permanece no commit testado.');
              }
            }
      - uses: actions/configure-pages@v5
      # Não refaz checkout: publica o artefato gerado após os testes neste run.
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Conferir o commit e a configuração efetivamente servidos
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_MAPBOX_CONFIG_SHA256: ${{ needs.validar.outputs.mapbox_config_sha256 }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --max-time 20 \
              "${PAGE_URL%/}/release-info.json?sha=$EXPECTED_SHA&mapa=$EXPECTED_MAPBOX_CONFIG_SHA256" \
              -o "$RUNNER_TEMP/release-info.json" && \
              curl --fail --silent --show-error --max-time 20 \
              "${PAGE_URL%/}/assets/mapa-config.js?sha=$EXPECTED_SHA&mapa=$EXPECTED_MAPBOX_CONFIG_SHA256" \
              -o "$RUNNER_TEMP/mapa-config.js" && \
              python3 -c 'import hashlib,json,os,re,sys; expected=os.environ["EXPECTED_MAPBOX_CONFIG_SHA256"]; info=json.load(open(sys.argv[1])); actual=hashlib.sha256(open(sys.argv[2],"rb").read()).hexdigest(); sys.exit(not (re.fullmatch(r"[a-f0-9]{64}",expected) and info.get("commit")==os.environ["EXPECTED_SHA"] and info.get("mapbox_configured") is True and info.get("mapbox_config_sha256")==expected and actual==expected))' "$RUNNER_TEMP/release-info.json" "$RUNNER_TEMP/mapa-config.js"; then
              echo "Commit e configuração publicados confirmados: $EXPECTED_SHA"
              exit 0
            fi
            sleep 10
          done
          echo 'Não foi possível confirmar o commit e a configuração publicados; verificar logs e publicadores paralelos.' >&2
          exit 1
