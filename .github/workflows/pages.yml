name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Não interromper uma publicação já iniciada com outro deploy concorrente.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validar:
    uses: ./.github/workflows/tests.yml
    with:
      upload_pages: true
  deploy:
    needs: validar
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Recusar publicação de um commit ultrapassado
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' });
            if (data.object.sha !== context.sha) {
              core.setFailed('A main avançou; publicar somente após validar o novo commit.');
            }
      - uses: actions/configure-pages@v5
      # Não refaz checkout: publica o artefato gerado após os testes neste run.
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Conferir o commit efetivamente servido
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --max-time 20 \
              "${PAGE_URL%/}/release-info.json?sha=$EXPECTED_SHA" \
              -o "$RUNNER_TEMP/release-info.json" && \
              python3 -c 'import json,os,sys; sys.exit(json.load(open(sys.argv[1])).get("commit") != os.environ["EXPECTED_SHA"])' "$RUNNER_TEMP/release-info.json"; then
              echo "Commit publicado confirmado: $EXPECTED_SHA"
              exit 0
            fi
            sleep 10
          done
          echo 'Não foi possível confirmar o commit publicado; verificar logs e publicadores paralelos.' >&2
          exit 1
