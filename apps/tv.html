<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modo TV — Método Torque</title>
<link rel="icon" href="../assets/icons/icon.svg" type="image/svg+xml">
<link href="../assets/fonts/archivo.css" rel="stylesheet">
<style>
  :root { --roxo: #7c3aed; --lilas: #a78bfa; --ok: #22c55e; --erro: #f87171; --alerta: #fbbf24; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: radial-gradient(110% 70% at 85% -20%, rgba(124,58,237,.2), transparent 60%), #121016; color: #fff; font-family: "Archivo", system-ui, sans-serif; overflow: hidden; }
  .tela { height: 100vh; display: flex; flex-direction: column; padding: 3.5vh 4vw; }
  .cab { display: flex; justify-content: space-between; align-items: center; }
  .marca { display: flex; align-items: center; gap: 14px; font-size: 2.2vh; font-weight: 700; letter-spacing: .2em; color: var(--lilas); }
  .marca::before { content: ""; width: 3.5vw; height: .55vh; background: linear-gradient(90deg, var(--roxo), var(--lilas)); border-radius: 4px; }
  .relogio { font-size: 3.2vh; font-weight: 800; font-variant-numeric: tabular-nums; }
  h1 { margin: 2.2vh 0 0; font-size: 5.6vh; font-weight: 800; letter-spacing: -.01em; }
  .conteudo { flex: 1; margin-top: 3vh; overflow: hidden; }
  .pontos { display: flex; gap: 10px; justify-content: center; padding-top: 2vh; }
  .pontos span { width: 12px; height: 12px; border-radius: 50%; background: #3a3644; }
  .pontos span.on { background: var(--roxo); }

  /* metas */
  .meta-acad { display: flex; gap: 4vw; margin-bottom: 3.5vh; }
  .meta-acad > div { flex: 1; }
  .rotulo { font-size: 2vh; font-weight: 700; letter-spacing: .16em; color: #a09aae; }
  .num { font-size: 6.4vh; font-weight: 800; margin: .6vh 0; }
  .num small { font-size: 2.6vh; color: #a09aae; font-weight: 600; }
  .barra { height: 2.2vh; background: #1b1822; border: 1px solid #2e2a38; border-radius: 999px; overflow: hidden; }
  .barra > div { height: 100%; background: linear-gradient(90deg, var(--roxo), var(--lilas)); border-radius: 999px; transition: width .5s cubic-bezier(.22,1,.36,1); }
  .barra.cheia > div { background: var(--ok); }
  .rank { display: flex; flex-direction: column; gap: 1.6vh; }
  .rk { display: grid; grid-template-columns: 6vh 1fr 22vw 16vw; gap: 2vw; align-items: center; font-size: 3.4vh; }
  .rk .pos { font-weight: 800; color: var(--lilas); }
  .rk .pos.p1 { color: #fff; background: linear-gradient(135deg, var(--roxo), var(--lilas)); text-align: center; border-radius: 12px; box-shadow: 0 8px 20px -8px rgba(124,58,237,.6); }
  .rk .nome { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rk .val { text-align: right; font-variant-numeric: tabular-nums; font-size: 3vh; }
  .rk .val strong { color: var(--ok); }

  /* listas (manutenção / checklist) */
  .lin { display: flex; align-items: center; gap: 1.6vw; padding: 1.6vh 0; border-bottom: 1px solid #2e2a38; font-size: 3.2vh; }
  .lin .tag { font-size: 1.9vh; font-weight: 800; letter-spacing: .08em; padding: .5vh 1vw; flex: none; border-radius: 999px; }
  .tag.erro { background: rgba(248,113,113,.15); color: var(--erro); }
  .tag.alerta { background: rgba(251,191,36,.14); color: var(--alerta); }
  .tag.roxo { background: rgba(124,58,237,.2); color: var(--lilas); }
  .tag.ok { background: rgba(34,197,94,.15); color: var(--ok); }
  .lin .quando { margin-left: auto; color: #a09aae; font-size: 2.6vh; white-space: nowrap; }
  .tudo-ok { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 2vh; color: var(--ok); font-size: 5vh; font-weight: 800; }
  .tudo-ok small { font-size: 2.4vh; color: #a09aae; font-weight: 600; }
  .aviso-vazio { color: #6e6a78; font-size: 3vh; padding-top: 6vh; text-align: center; }

  /* quadro de horários */
  .aula-tv { display: grid; grid-template-columns: 12vw 1fr 18vw; gap: 2vw; align-items: center; padding: 1.5vh 0; border-bottom: 1px solid #2e2a38; font-size: 3.2vh; }
  .aula-tv .hr { font-weight: 800; font-variant-numeric: tabular-nums; font-size: 3.8vh; }
  .aula-tv.rolou { opacity: .38; }
  .aula-tv.agora .hr { color: var(--ok); }
  .aula-tv.logo .hr { color: var(--alerta); }
  .aula-tv .quem { color: #a09aae; font-size: 2.6vh; }
  .aula-tv .st { text-align: right; }

  /* avisos da academia */
  .aviso-tv { display: flex; gap: 1.6vw; align-items: flex-start; background: rgba(28,24,38,.85); border: 1px solid #2c2739; border-left: .6vw solid var(--roxo); border-radius: 20px; padding: 2.4vh 2vw; margin-bottom: 2vh; font-size: 3.4vh; line-height: 1.4; }

  /* telão por modalidade: quem vem + treino do dia */
  .aula-bloco { background: rgba(28,24,38,.85); border: 1px solid #2c2739; border-radius: 20px; padding: 2vh 2vw; margin-bottom: 2vh; }
  .aula-bloco .cab-aula { display: flex; align-items: baseline; gap: 1.6vw; font-size: 3.2vh; }
  .aula-bloco .cab-aula .hr { font-weight: 800; font-size: 3.8vh; font-variant-numeric: tabular-nums; }
  .aula-bloco .cab-aula .quem { color: #a09aae; font-size: 2.4vh; }
  .aula-bloco .cab-aula .cont { margin-left: auto; color: #a09aae; font-size: 2.6vh; white-space: nowrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 1vh 0.8vw; margin-top: 1.4vh; }
  .chip-tv { background: rgba(124,58,237,.16); border: 1px solid #3a3350; border-radius: 999px; padding: .7vh 1.4vw; font-size: 2.6vh; font-weight: 600; white-space: nowrap; }
  .chip-tv.mais { background: none; color: #a09aae; }
  .sem-gente { color: #6e6a78; font-size: 2.6vh; margin-top: 1.2vh; }
  .wod-tv { display: flex; gap: 3vw; height: 100%; }
  .wod-tv .col { flex: 1; min-width: 0; overflow: hidden; }
  .wod-tv .rotulo { font-size: 2vh; font-weight: 700; letter-spacing: .16em; color: #a09aae; margin: 1.6vh 0 .6vh; }
  .wod-tv pre { margin: 0; font-family: inherit; font-size: 3vh; line-height: 1.5; white-space: pre-wrap; }
  .wod-tv .tipo-wod { display: inline-block; background: rgba(124,58,237,.2); color: var(--lilas); font-weight: 800; font-size: 2.2vh; letter-spacing: .1em; border-radius: 999px; padding: .6vh 1.6vw; margin-top: .6vh; }

  /* barra de alerta de aula (fixa em todos os painéis) */
  .alerta-aula { display: none; align-items: center; gap: 1.6vw; margin-top: 2vh; padding: 1.8vh 2.2vw; border-radius: 18px; font-size: 3vh; font-weight: 700; background: rgba(28,24,38,.9); border: 1px solid #2e2a38; }
  .alerta-aula.on { display: flex; }
  .alerta-aula .sino { font-size: 4vh; }
  .alerta-aula.urgente { background: rgba(251,191,36,.14); border-color: var(--alerta); animation: pulsa 1.6s ease-in-out infinite; }
  .alerta-aula.urgente .txt b { color: var(--alerta); }
  @keyframes pulsa { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.012); } }
</style>
</head>
<body>
<div class="tela">
  <div class="cab">
    <span style="display: flex; align-items: center; gap: 2vw;">
      <img id="logoCliente" alt="Logo da academia" hidden
           style="max-height: 8vh; max-width: 18vw; object-fit: contain; background: #fff; padding: .6vh 1vw;">
      <span class="marca">MÉTODO TORQUE</span>
    </span>
    <span class="relogio" id="relogio"></span>
  </div>
  <h1 id="titulo"></h1>
  <div class="conteudo" id="conteudo"></div>
  <div class="alerta-aula" id="alertaAula"><span class="sino">🔔</span><span class="txt" id="alertaTxt"></span></div>
  <div class="pontos" id="pontos"></div>
</div>

<script src="../assets/access-config.js"></script>
<script src="../assets/cloud-config.js"></script>
<script src="../assets/vendor/supabase.js"></script>
<script src="store.js"></script>
<script>
(function () {
  "use strict";
  var S = window.MTStore;
  var $ = function (id) { return document.getElementById(id); };

  var INTERVALO = 12000; // troca de painel
  var params = new URLSearchParams(location.search);
  var fixo = params.get("painel"); // ?painel=metas|manutencao|checklist|aulas|avisos|woddia|agendados para travar
  // telão por modalidade: ?atividade=crossfit filtra aulas/alerta e liga o treino do dia + quem vem
  var atividade = (params.get("atividade") || "").trim().toLowerCase();
  function daAtividade(nome) { return !atividade || String(nome || "").toLowerCase().indexOf(atividade) !== -1; }

  function esc(s) { return String(s == null ? "" : s).replace(/[<>&]/g, function (c) { return { "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]; }); }

  // ---------- painéis ----------
  function painelMetas() {
    var st = S.read("metas", { vendedoras: [], metas: {}, vendas: [] });
    var mk = S.monthKey();
    var meta = st.metas[mk] || { acad: { mat: 0, rec: 0 }, vend: {} };
    var vendas = st.vendas.filter(function (v) { return v.data.slice(0, 7) === mk; });
    var totMat = vendas.filter(function (v) { return v.tipo === "matricula"; }).length;
    var totRec = vendas.reduce(function (a, v) { return a + (+v.valor || 0); }, 0);

    var html = '<div class="meta-acad">' +
      blocoAcad("MATRÍCULAS NO MÊS", totMat, meta.acad.mat, function (n) { return Math.round(n); }) +
      blocoAcad("RECEITA DE VENDAS", totRec, meta.acad.rec, S.fmtBRL) + "</div>";

    var linhas = st.vendedoras.filter(function (v) { return v.ativa !== false; }).map(function (v) {
      var minhas = vendas.filter(function (x) { return x.vid === v.id; });
      var mat = minhas.filter(function (x) { return x.tipo === "matricula"; }).length;
      var rec = minhas.reduce(function (a, x) { return a + (+x.valor || 0); }, 0);
      var m = meta.vend[v.id] || { mat: 0, rec: 0 };
      var pct = m.rec > 0 ? rec / m.rec * 100 : (m.mat > 0 ? mat / m.mat * 100 : 0);
      return { nome: v.nome, mat: mat, rec: rec, pct: pct };
    }).sort(function (a, b) { return b.pct - a.pct || b.rec - a.rec; }).slice(0, 6);

    if (linhas.length) {
      html += '<div class="rank">' + linhas.map(function (l, i) {
        var p = Math.min(100, l.pct);
        return '<div class="rk"><span class="pos' + (i === 0 ? " p1" : "") + '">' + (i + 1) + 'º</span>' +
          '<span class="nome">' + esc(l.nome) + "</span>" +
          '<span class="barra' + (l.pct >= 100 ? " cheia" : "") + '"><div style="width:' + p + '%"></div></span>' +
          '<span class="val"><strong>' + Math.round(l.pct) + "%</strong> · " + S.fmtBRL(l.rec) + "</span></div>";
      }).join("") + "</div>";
    } else {
      html += '<div class="aviso-vazio">Cadastre as vendedoras no programa Metas de Vendas.</div>';
    }
    return { titulo: "Metas do mês 🎯", html: html };

    function blocoAcad(rotulo, real, alvo, fmt) {
      var pct = alvo > 0 ? Math.min(100, real / alvo * 100) : 0;
      return "<div><div class=\"rotulo\">" + rotulo + '</div><div class="num">' + fmt(real) +
        " <small>/ " + (alvo ? fmt(alvo) : "—") + '</small></div><div class="barra' + (pct >= 100 ? " cheia" : "") + '"><div style="width:' + pct + '%"></div></div></div>';
    }
  }

  function painelManutencao() {
    var st = S.read("manut", { chamados: [] });
    var hoje = S.todayISO();
    var CAT = { aparelho: "🏋", predial: "🏢", limpeza: "🧽" };
    var pend = st.chamados.filter(function (c) { return c.status !== "resolvido"; })
      .sort(function (a, b) {
        var aa = a.agendado && a.agendado < hoje ? 0 : 1;
        var bb = b.agendado && b.agendado < hoje ? 0 : 1;
        if (aa !== bb) return aa - bb;
        return (a.agendado || "9999") < (b.agendado || "9999") ? -1 : 1;
      }).slice(0, 7);

    if (!pend.length) return { titulo: "Manutenção 🔧", html: '<div class="tudo-ok">✓ Nenhuma pendência<small>Aparelhos, predial e limpeza em dia</small></div>' };

    var html = pend.map(function (c) {
      var atr = c.agendado && c.agendado < hoje;
      var tag = atr ? '<span class="tag erro">ATRASADO</span>' :
        c.agendado === hoje ? '<span class="tag alerta">HOJE</span>' :
        c.agendado ? '<span class="tag roxo">AGENDADO</span>' : '<span class="tag alerta">EM ABERTO</span>';
      return '<div class="lin"><span>' + CAT[c.cat] + "</span>" + tag +
        "<span>" + esc(c.titulo) + (c.local ? ' <span style="color:#a09aae;">· ' + esc(c.local) + "</span>" : "") + "</span>" +
        '<span class="quando">' + (c.agendado ? S.fmtData(c.agendado) : "sem data") + "</span></div>";
    }).join("");
    return { titulo: "Manutenção 🔧", html: html };
  }

  function painelChecklist() {
    var st = S.read("checklist", null);
    if (!st || !st.tarefas.length) return { titulo: "Checklist do dia ✅", html: '<div class="aviso-vazio">Configure o programa Checklist do Dia.</div>' };
    var hoje = S.todayISO();
    var marcas = st.dias[hoje] || {};
    var agora = new Date();
    var hm = ("0" + agora.getHours()).slice(-2) + ":" + ("0" + agora.getMinutes()).slice(-2);

    var pend = st.tarefas.filter(function (t) { return !(marcas[t.id] && marcas[t.id].feito); });
    var atrasados = pend.filter(function (t) { return t.hora && hm > t.hora; });
    var feitos = st.tarefas.length - pend.length;

    var html = '<div class="meta-acad"><div><div class="rotulo">CONCLUÍDO HOJE</div><div class="num">' + feitos +
      " <small>/ " + st.tarefas.length + '</small></div><div class="barra' + (pend.length === 0 ? " cheia" : "") +
      '"><div style="width:' + (feitos / st.tarefas.length * 100) + '%"></div></div></div></div>';

    if (!pend.length) {
      html += '<div class="tudo-ok" style="height:50%;">✓ Checklist 100% concluído</div>';
    } else {
      var equipe = st.equipe || [];
      html += (atrasados.length ? atrasados : pend).slice(0, 6).map(function (t) {
        var atr = t.hora && hm > t.hora;
        var r = equipe.find(function (e) { return e.id === t.resp; });
        return '<div class="lin">' + (atr ? '<span class="tag erro">ATRASADO</span>' : '<span class="tag roxo">' + (t.turno === "abertura" ? "ABERTURA" : "FECHAMENTO") + "</span>") +
          "<span>" + esc(t.texto) + "</span>" +
          '<span class="quando">' + (r ? "👤 " + esc(r.nome) + " · " : "") + "limite " + (t.hora || "—") + "</span></div>";
      }).join("");
    }
    return { titulo: "Checklist do dia ✅", html: html };
  }

  // ---------- rotação ----------
  function painelDestaques() {
    var st = S.read("treinoDestaques", { itens: [] });
    var itens = (st.itens || []).slice(0, 6);
    if (!itens.length) return { titulo: "Destaques de treino 🏅", html: '<div class="aviso-vazio">Os recordes da semana dos alunos (registrados pelo app) aparecem aqui.</div>' };
    return {
      titulo: "Destaques da semana 🏅",
      html: '<div class="rank">' + itens.map(function (l, i) {
        return '<div class="rk"><span class="pos' + (i === 0 ? " p1" : "") + '">' + (i + 1) + "º</span>" +
          "<span>" + String(l.nome).split(" ")[0] + " · " + l.exercicio + "</span>" +
          "<span></span><span><b>" + String(l.kg).replace(".", ",") + " kg</b></span></div>";
      }).join("") + "</div>",
    };
  }

  // painel privado do dono: ?painel=dono (não entra na rotação do telão dos alunos)
  function painelDono() {
    var stA = S.read("alunos", { alunos: [], planos: [], recebiveis: [] });
    var hoje = S.todayISO();
    var mes = hoje.slice(0, 7);
    var ativos = 0, mrr = 0, receitaMes = 0, inadVal = 0, novosMes = 0, cancelMes = 0;
    stA.alunos.forEach(function (a) {
      var c0 = (a.contratos || []).find(function (c) { return c.status === "ativo" || c.status === "congelado"; });
      if (c0) {
        ativos++;
        var pl = (stA.planos || []).find(function (p) { return p.id === c0.planoId; });
        mrr += +c0.valor || (pl ? +pl.valor : 0) || 0;
      }
      (a.contratos || []).forEach(function (c) {
        if ((c.inicio || "").slice(0, 7) === mes) novosMes++;
        if (c.status === "cancelado" && (c.canceladoEm || "").slice(0, 7) === mes) cancelMes++;
      });
    });
    stA.recebiveis.forEach(function (r) {
      if (r.status === "pago" && (r.pagoEm || "").slice(0, 7) === mes) receitaMes += +r.valor || 0;
      if (r.status === "aberto" && r.vencimento < hoje) inadVal += +r.valor || 0;
    });
    (S.read("produtos", { vendas: [] }).vendas || []).forEach(function (v) {
      if (((v.data || v.quando || "")).slice(0, 7) === mes) receitaMes += +v.total || 0;
    });
    var metas = S.read("metasNegocio", { faturamento: 0 });
    var diaAtual = new Date().getDate();
    var diasNoMes = new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0).getDate();
    var proj = diaAtual ? receitaMes / diaAtual * diasNoMes : 0;
    var snaps = S.read("riscoHist", { snapshots: [] }).snapshots;
    var risco = snaps.length ? snaps[snaps.length - 1].alto : null;
    function brlTV(v) { return "R$ " + Math.round(v).toLocaleString("pt-BR"); }
    var linhas = [
      ["ATIVOS", ativos, ""],
      ["MRR", brlTV(mrr), ""],
      ["RECEITA DO MÊS", brlTV(receitaMes), metas.faturamento ? "meta " + brlTV(+metas.faturamento) + " · projeção " + brlTV(proj) + (proj >= +metas.faturamento ? " ✅" : " ⚠️") : "projeção " + brlTV(proj)],
      ["NOVOS × CANCELADOS", novosMes + " × " + cancelMes, cancelMes > novosMes ? "⚠️ saldo negativo" : "saldo +" + (novosMes - cancelMes)],
      ["INADIMPLÊNCIA EM ABERTO", brlTV(inadVal), ""],
    ];
    if (risco != null) linhas.push(["ALUNOS EM RISCO ALTO", risco, "Copiloto IA"]);
    return {
      titulo: "Painel do Dono 🔒",
      html: '<div class="rank">' + linhas.map(function (l) {
        return '<div class="rk" style="grid-template-columns:1fr 22vw 26vw;"><span class="nome" style="color:#a09aae;font-size:2.4vh;letter-spacing:.1em;">' + l[0] + "</span>" +
          '<span style="font-weight:800;font-size:4vh;text-align:right;font-variant-numeric:tabular-nums;">' + l[1] + "</span>" +
          '<span style="color:#a09aae;font-size:2.2vh;text-align:right;">' + l[2] + "</span></div>";
      }).join("") + "</div>",
    };
  }

  // ---------- quadro de horários de hoje (grade + turmas) ----------
  function minutosDe(hhmm) {
    var p2 = String(hhmm || "").split(":");
    return p2.length === 2 ? (+p2[0]) * 60 + (+p2[1]) : null;
  }
  function aulasDeHoje() {
    var hoje = S.todayISO();
    var dow = new Date(hoje + "T12:00").getDay();
    var gr = S.read("grade", { aulas: [], avulsas: [] });
    var lista = [];
    (gr.aulas || []).forEach(function (a) {
      if ((a.dias || []).indexOf(dow) !== -1 && a.inicio) {
        lista.push({ id: a.id, hora: a.inicio, nome: a.nome, prof: a.prof || "", sala: a.sala || "", dur: +a.dur || 60, vagas: +a.vagas || 0, fixos: a.fixos || [] });
      }
    });
    (gr.avulsas || []).forEach(function (a) {
      if (a.data === hoje && a.inicio) {
        lista.push({ id: a.id, hora: a.inicio, nome: a.nome, prof: a.prof || "", sala: a.sala || "", dur: +a.dur || 60, vagas: +a.vagas || 0, fixos: [] });
      }
    });
    (S.read("turmas", { turmas: [] }).turmas || []).forEach(function (t) {
      if (t.hora) lista.push({ id: "", hora: t.hora, nome: t.nome, prof: t.prof || "", sala: "", dur: 60, vagas: +t.capacidade || 0, fixos: t.alunos || [] });
    });
    return lista.filter(function (a) { return daAtividade(a.nome); })
      .sort(function (a, b) { return a.hora < b.hora ? -1 : 1; });
  }
  function painelAulas() {
    var lista = aulasDeHoje();
    if (!lista.length) return { titulo: "Horários de hoje 🗓", html: '<div class="aviso-vazio">Sem aulas na grade de hoje — monte a Grade de Aulas ou as Turmas no sistema.</div>' };
    var agora = new Date();
    var minAgora = agora.getHours() * 60 + agora.getMinutes();
    // mostra as que estão rolando/por vir primeiro; passadas ficam apagadas no fim da tela
    var futuras = lista.filter(function (a) { var m = minutosDe(a.hora); return m === null || m + a.dur > minAgora; });
    var passadas = lista.filter(function (a) { var m = minutosDe(a.hora); return m !== null && m + a.dur <= minAgora; });
    var mostrar = futuras.slice(0, 8).concat(passadas.slice(-Math.max(0, 8 - Math.min(8, futuras.length))));
    var html = mostrar.map(function (a) {
      var m = minutosDe(a.hora);
      var cls = "", st = "";
      if (m !== null && m <= minAgora && m + a.dur > minAgora) { cls = "agora"; st = '<span class="tag ok">AGORA</span>'; }
      else if (m !== null && m > minAgora && m - minAgora <= 15) { cls = "logo"; st = '<span class="tag alerta">EM ' + (m - minAgora) + ' MIN</span>'; }
      else if (m !== null && m + a.dur <= minAgora) { cls = "rolou"; st = '<span class="tag roxo">JÁ ROLOU</span>'; }
      return '<div class="aula-tv ' + cls + '"><span class="hr">' + esc(a.hora) + "</span>" +
        "<span><b>" + esc(a.nome) + "</b><div class='quem'>" + esc(a.prof) + (a.sala ? " · " + esc(a.sala) : "") + "</div></span>" +
        '<span class="st">' + st + "</span></div>";
    }).join("");
    return { titulo: "Horários de hoje 🗓", html: html };
  }

  // ---------- telão por modalidade: quem vem hoje (agendados por horário) ----------
  function painelAgendados() {
    var lista = aulasDeHoje();
    var rotuloAtiv = atividade ? atividade.toUpperCase() + " — " : "";
    if (!lista.length) return { titulo: rotuloAtiv + "Quem vem hoje 🤝", html: '<div class="aviso-vazio">Sem aulas' + (atividade ? " de " + esc(atividade.toUpperCase()) : "") + ' na grade de hoje.</div>' };
    var hoje = S.todayISO();
    var presencas = S.read("grade", { presencas: {} }).presencas || {};
    var agora = new Date();
    var minAgora = agora.getHours() * 60 + agora.getMinutes();
    var futuras = lista.filter(function (a) { var m = minutosDe(a.hora); return m === null || m + a.dur > minAgora; });
    var mostrar = (futuras.length ? futuras : lista.slice(-2)).slice(0, 3);
    var html = mostrar.map(function (a) {
      var m = minutosDe(a.hora);
      var st = "";
      if (m !== null && m <= minAgora && m + a.dur > minAgora) st = '<span class="tag ok">AGORA</span>';
      else if (m !== null && m > minAgora && m - minAgora <= 15) st = '<span class="tag alerta">EM ' + (m - minAgora) + ' MIN</span>';
      var nomes = (a.fixos || []).concat(a.id ? (presencas[a.id + "|" + hoje] || []) : []);
      nomes = nomes.filter(function (n, i) { return n && nomes.indexOf(n) === i; });
      var chips = nomes.slice(0, 14).map(function (n) { return '<span class="chip-tv">' + esc(n) + "</span>"; }).join("") +
        (nomes.length > 14 ? '<span class="chip-tv mais">+' + (nomes.length - 14) + "</span>" : "");
      return '<div class="aula-bloco"><div class="cab-aula"><span class="hr">' + esc(a.hora) + "</span>" +
        "<span><b>" + esc(a.nome) + '</b> <span class="quem">' + esc(a.prof) + (a.sala ? " · " + esc(a.sala) : "") + "</span></span>" +
        st + '<span class="cont">' + nomes.length + (a.vagas ? " / " + a.vagas : "") + " aluno(s)</span></div>" +
        (nomes.length ? '<div class="chips">' + chips + "</div>" : '<div class="sem-gente">Ninguém agendado ainda — bora chamar a galera! 📲</div>') +
        "</div>";
    }).join("");
    return { titulo: rotuloAtiv + "Quem vem hoje 🤝", html: html };
  }

  // ---------- telão por modalidade: treino do dia (WOD) ----------
  function painelWodDia() {
    var w = (S.read("wod", { dias: {} }).dias || {})[S.todayISO()];
    var rotuloAtiv = atividade ? atividade.toUpperCase() + " — " : "";
    if (!w) return { titulo: rotuloAtiv + "Treino do dia 🏋️", html: '<div class="aviso-vazio">Monte o WOD de hoje no programa Treino do Dia (WOD).</div>' };
    var placar = (w.resultados || []).slice(0, 5);
    var html = '<div class="wod-tv"><div class="col">' +
      "<div style='font-size:4.6vh;font-weight:800;'>" + esc(w.nome || "WOD do dia") + "</div>" +
      (w.tipo ? '<span class="tipo-wod">' + esc(w.tipo) + "</span>" : "") +
      (w.aquecimento ? '<div class="rotulo">AQUECIMENTO</div><pre>' + esc(w.aquecimento) + "</pre>" : "") +
      '<div class="rotulo">TREINO</div><pre>' + esc(w.treino || "") + "</pre>" +
      (w.obs ? '<div class="rotulo">ESCALAS / OBS</div><pre>' + esc(w.obs) + "</pre>" : "") +
      "</div>" +
      (placar.length ? '<div class="col" style="flex:.6;"><div class="rotulo">PLACAR DE HOJE 🏆</div>' +
        placar.map(function (r, i) {
          return '<div class="rk" style="grid-template-columns:5vh 1fr auto;font-size:3vh;padding:.8vh 0;"><span class="pos' + (i === 0 ? " p1" : "") + '">' + (i + 1) + "º</span>" +
            '<span class="nome">' + esc(r.aluno) + "</span><span><b>" + esc(r.resultado) + "</b></span></div>";
        }).join("") + "</div>" : "") +
      "</div>";
    return { titulo: rotuloAtiv + "Treino do dia 🏋️", html: html };
  }

  // ---------- avisos da academia (escritos na Grade de Aulas → card 📺) ----------
  function avisosAtivos() {
    return (S.read("tvAvisos", { itens: [] }).itens || []).filter(Boolean).slice(0, 6);
  }
  function painelAvisos() {
    var itens = avisosAtivos();
    return {
      titulo: "Avisos da academia 📌",
      html: itens.map(function (t) { return '<div class="aviso-tv"><span>📌</span><span>' + esc(t) + "</span></div>"; }).join("") ||
        '<div class="aviso-vazio">Escreva os avisos no card 📺 da Grade de Aulas.</div>',
    };
  }

  // ---------- alerta fixo: próxima aula (pulsa quando falta ≤ 15 min) ----------
  function atualizaAlerta() {
    var el = $("alertaAula");
    var agora = new Date();
    var minAgora = agora.getHours() * 60 + agora.getMinutes();
    var prox = null;
    aulasDeHoje().forEach(function (a) {
      var m = minutosDe(a.hora);
      if (m === null || m < minAgora) return;
      if (!prox || m < prox.m) prox = { m: m, a: a };
    });
    if (!prox) { el.className = "alerta-aula"; return; }
    var falta = prox.m - minAgora;
    var quem = prox.a.nome + (prox.a.prof ? " com " + prox.a.prof : "") + (prox.a.sala ? " · " + prox.a.sala : "");
    if (falta <= 15) {
      el.className = "alerta-aula on urgente";
      $("alertaTxt").innerHTML = "<b>COMEÇA " + (falta <= 0 ? "AGORA" : "EM " + falta + " MIN") + "</b> — " + esc(quem);
    } else {
      el.className = "alerta-aula on";
      $("alertaTxt").innerHTML = "Próxima aula às <b>" + esc(prox.a.hora) + "</b> — " + esc(quem);
    }
  }
  window.__tvAlerta = atualizaAlerta; // testes

  var paineis = { metas: painelMetas, manutencao: painelManutencao, checklist: painelChecklist, destaques: painelDestaques, dono: painelDono, aulas: painelAulas, avisos: painelAvisos, agendados: painelAgendados, woddia: painelWodDia };
  function montaOrdem() {
    if (fixo && paineis[fixo]) return [fixo];
    if (atividade) {
      // telão da sala/modalidade: treino do dia + quem vem + avisos gerais
      var o2 = [];
      if ((S.read("wod", { dias: {} }).dias || {})[S.todayISO()]) o2.push("woddia");
      o2.push("agendados");
      if (avisosAtivos().length) o2.push("avisos");
      return o2;
    }
    var o = [];
    if (aulasDeHoje().length) o.push("aulas");
    if (avisosAtivos().length) o.push("avisos");
    o.push("metas", "manutencao", "checklist");
    if ((S.read("treinoDestaques", { itens: [] }).itens || []).length) o.push("destaques");
    return o;
  }
  var ordem = montaOrdem();
  var idx = 0;

  function mostra() {
    ordem = montaOrdem();
    if (idx >= ordem.length) idx = 0;
    var p = paineis[ordem[idx]]();
    $("titulo").textContent = p.titulo;
    $("conteudo").innerHTML = p.html;
    $("pontos").innerHTML = ordem.length > 1 ? ordem.map(function (_, i) {
      return '<span class="' + (i === idx ? "on" : "") + '"></span>';
    }).join("") : "";
    atualizaAlerta();
  }

  function proximo() { idx = (idx + 1) % ordem.length; mostra(); }

  function relogio() {
    var d = new Date();
    $("relogio").textContent = d.toLocaleDateString("pt-BR", { weekday: "short", day: "2-digit", month: "2-digit" }) +
      "  " + ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
  }

  relogio(); mostra();
  setInterval(relogio, 10000);
  setInterval(atualizaAlerta, 30000);
  // rotaciona quando há mais de um painel; senão só re-renderiza (pega aula/aviso novo que chegar do sync)
  setInterval(function () { if (ordem.length > 1) proximo(); else mostra(); }, INTERVALO);
  S.onChange(function () { mostra(); });
  document.addEventListener("click", function () {
    if (document.fullscreenElement) return;
    document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(function () {});
  });
})();
</script>
</body>
</html>
