buildscript {
    ext.kotlin_version = '2.2.20'
    repositories { google(); mavenCentral() }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.10.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}
apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
android {
    namespace 'com.torqueon.health'
    compileSdk 36
    defaultConfig { minSdk 26; targetSdk 35 }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
repositories { google(); mavenCentral() }
dependencies {
    implementation project(':capacitor-android')
    // Plugin.getActivity() expõe AppCompatActivity; o Capacitor usa essa
    // dependência internamente, mas não a exporta ao classpath do plugin.
    implementation "androidx.appcompat:appcompat:${rootProject.ext.has('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.7.0'}"
    implementation 'androidx.health.connect:connect-client:1.1.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
}
