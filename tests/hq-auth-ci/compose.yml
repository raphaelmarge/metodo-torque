# Disposable GitHub CI only. Every credential below is a PUBLIC TEST FIXTURE.
# These pinned tags are recorded with their resolved image IDs/digests by run.sh.
services:
  db:
    image: postgres:17.11-bookworm
    restart: "no"
    environment:
      POSTGRES_DB: hq_auth_ci
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: hq_auth_ci_postgres_test_only
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-init.sql:/docker-entrypoint-initdb.d/00-hq-ci.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hq_auth_ci"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s

  auth:
    image: supabase/gotrue:v2.196.0
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: http://127.0.0.1:59999
      GOTRUE_SITE_URL: http://127.0.0.1:59999
      GOTRUE_URI_ALLOW_LIST: http://127.0.0.1:59999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:hq_auth_ci_auth_test_only@db:5432/hq_auth_ci
      GOTRUE_DB_NAMESPACE: auth
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_SECRET: hq-auth-ci-only-hs256-secret-never-use-in-production-20260930
      GOTRUE_JWT_ISSUER: http://127.0.0.1:59999
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_SMS_AUTOCONFIRM: "false"
      LOG_LEVEL: error
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s

  rest:
    image: postgrest/postgrest:v14.17
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:hq_auth_ci_rest_test_only@db:5432/hq_auth_ci
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_JWT_SECRET: hq-auth-ci-only-hs256-secret-never-use-in-production-20260930
      PGRST_ADMIN_SERVER_HOST: 127.0.0.1
      PGRST_ADMIN_SERVER_PORT: "3001"
      PGRST_LOG_LEVEL: error
    command: ["postgrest"]
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s

networks:
  default:
    # Docker may omit published ports when this is the only attached network.
    # run.sh forwards exactly three loopback ports to validated container IPs;
    # services stay exclusively on this internal bridge without Internet egress.
    internal: true

volumes:
  pgdata:
